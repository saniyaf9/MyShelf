<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyShelf</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #080f13;
  color: #f9f9f9;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}
.library {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 270px;
  min-height: 100vh;
  padding: 30px 20px;
  background: #080f13;
  border-right: 1px solid #263238;
  flex-shrink: 0;
}

.main {
  flex: 1;
  min-width: 0;
  padding: 40px;
}

.logo {
  font-family: Georgia, serif;
  font-size: 34px;
  margin-left: 12px;
}

.tagline {
  margin: 8px 12px 35px;
  color: #8e999e;
  font-size: 10px;
  letter-spacing: 3px;
}

.nav-item {
  height: 48px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 13px;
  margin-bottom: 6px;
  border-radius: 12px;
  color: #eee;
  transition: .2s;
}

.nav-item:hover {
  background: #101a1f;
}

.nav-item.active {
  background: #162228;
}

.nav-icon {
  width: 25px;
}

.nav-name {
  flex: 1;
}

.nav-count {
  color: #8e999e;
  font-size: 12px;
}

.shelves-title {
  display: flex;
  align-items: center;
  margin: 45px 13px 15px;
  color: #8e999e;
  font-size: 10px;
  letter-spacing: 2px;
}

.shelves-title span {
  flex: 1;
}

.add-shelf {
  font-size: 24px;
  color: white;
  cursor: pointer;
}

#shelfList {
  margin-top: 5px;
}

.shelf-nav {
  display: flex;
  align-items: center;
  padding: 10px 13px;
  border-radius: 10px;
  cursor: pointer;
  color: #d9dfe1;
}

.shelf-nav:hover {
  background: #101a1f;
}

.shelf-nav.active {
  background: #162228;
}

.shelf-nav span:first-child {
  flex: 1;
}

.shelf-nav small {
  color: #7d898e;
}

.quote {
  margin: 70px 13px 0;
  color: #778388;
  font-family: Georgia, serif;
  font-style: italic;
  line-height: 1.6;
  font-size: 13px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
}

.eyebrow {
  color: #8e999e;
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-weight: 400;
  font-size: 48px;
}

.actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.total {
  color: #8e999e;
  font-size: 12px;
}

.sort {
  height: 42px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid #303d43;
  background: #10191e;
  color: white;
}

.add-button {
  height: 42px;
  padding: 0 20px;
  border: none;
  border-radius: 22px;
  background: white;
  color: #080f13;
  font-weight: bold;
}

.shelf-header {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-top: 50px;
  margin-bottom: 20px;
}

.shelf-header h2 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 28px;
  font-weight: 400;
}

.shelf-header span {
  color: #7f8b90;
  font-size: 12px;
}

.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 25px;
}

.book-card {
  position: relative;
  background: #10191e;
  border: 1px solid #263238;
  border-radius: 14px;
  overflow: hidden;
  transition: transform .2s, border .2s;
}

.book-card:hover {
  transform: translateY(-3px);
  border-color: #46555c;
}

.cover {
  height: 250px;
  background: #162228;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.cover-placeholder {
  font-size: 55px;
}

.book-info {
  padding: 15px;
}

.book-title {
  font-family: Georgia, serif;
  font-size: 18px;
  line-height: 1.25;
}

.book-series {
  margin-top: 6px;
  color: #7f8b90;
  font-size: 12px;
}

.book-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 13px;
}

.favorite {
  border: none;
  background: none;
  color: #707c81;
  font-size: 27px;
  padding: 0;
  line-height: 1;
}

.favorite.active {
  color: white;
}

.menu-button {
  border: none;
  background: transparent;
  color: #9aa4a8;
  font-size: 23px;
  padding: 0 5px;
}

.menu {
  position: absolute;
  right: 10px;
  bottom: 48px;
  width: 125px;
  background: #182328;
  border: 1px solid #344249;
  border-radius: 10px;
  padding: 5px;
  display: none;
  z-index: 10;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
}

.menu.show {
  display: block;
}

.menu button {
  width: 100%;
  padding: 9px;
  background: transparent;
  border: none;
  color: white;
  text-align: left;
  border-radius: 7px;
}

.menu button:hover {
  background: #26343a;
}

.menu .delete {
  color: #ff8f8f;
}

.empty-state {
  min-height: 55vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.empty-icon {
  font-size: 60px;
}

.empty-state h2 {
  font-family: Georgia, serif;
  font-size: 32px;
  font-weight: 400;
}

.empty-state p {
  color: #8e999e;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 450px;
  background: #111b20;
  border: 1px solid #35434a;
  border-radius: 16px;
  padding: 25px;
}

.modal-box h2 {
  margin-top: 0;
  font-family: Georgia, serif;
  font-weight: 400;
}

.modal-box input,
.modal-box select {
  width: 100%;
  padding: 13px;
  margin-bottom: 12px;
  background: #0b1317;
  border: 1px solid #334148;
  border-radius: 9px;
  color: white;
  outline: none;
}

.modal-box label {
  display: block;
  color: #9ba5a9;
  font-size: 12px;
  margin-bottom: 6px;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.modal-buttons button {
  flex: 1;
  padding: 12px;
  border-radius: 9px;
  border: none;
}

.save-button {
  background: white;
  color: black;
  font-weight: bold;
}

.cancel-button {
  background: #26343a;
  color: white;
}

@media(max-width:800px) {

  .sidebar {
    width: 220px;
  }

  .main {
    padding: 25px;
  }

  .top {
    align-items: flex-start;
    flex-direction: column;
  }

  .actions {
    flex-wrap: wrap;
  }
}

@media(max-width:600px) {

  .library {
    display: block;
  }

  .sidebar {
    width: 100%;
    min-height: auto;
    border-right: none;
    border-bottom: 1px solid #263238;
  }

  .quote {
    display: none;
  }

  .main {
    padding: 25px 18px;
  }

  h1 {
    font-size: 38px;
  }

  .book-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
  }

  .cover {
    height: 210px;
  }
}
</style>
</head>

<body>

<div class="library">

<aside class="sidebar">

  <div class="logo">MyShelf</div>

  <div class="tagline">
    YOUR LITTLE LIBRARY
  </div>

  <div class="nav">

    <div class="nav-item active" onclick="showAllBooks()">
      <div class="nav-icon">📚</div>
      <div class="nav-name">All Books</div>
      <div class="nav-count" id="allCount">0</div>
    </div>

    <div class="nav-item" onclick="showFavorites()">
      <div class="nav-icon">♥</div>
      <div class="nav-name">Favorites</div>
      <div class="nav-count" id="favoriteCount">0</div>
    </div>

  </div>

  <div class="shelves-title">
    <span>MY SHELVES</span>
    <div class="add-shelf" onclick="openShelfModal()">+</div>
  </div>

  <div id="shelfList"></div>

  <div class="quote">
    "A room without books is like a body without a soul."
  </div>

</aside>

<main class="main">

  <div class="top">

    <div>
      <div class="eyebrow">
        YOUR PERSONAL LIBRARY
      </div>

      <h1 id="pageTitle">
        My Books
      </h1>
    </div>

    <div class="actions">

      <span class="total" id="totalText">
        0 books
      </span>

      <select class="sort" id="sortSelect">
        <option value="recent">Recently Added</option>
        <option value="title">Title A–Z</option>
        <option value="favorite">Favorites First</option>
      </select>

      <a
        href="https://saniyaf9.github.io/MyShelf1/drive.html"
        target="_blank"
        class="add-button"
        style="text-decoration:none;display:flex;align-items:center;"
      >
        + Add Books 📚
      </a>

    </div>

  </div>


  <div id="content"></div>

</main>

</div>

<div class="modal" id="bookModal">

  <div class="modal-box">

    <h2 id="bookModalTitle">
      Add Book
    </h2>

    <label>Book title</label>

    <input
      id="bookTitle"
      type="text"
      placeholder="e.g. Twisted Love"
    >

    <label>Cover image URL</label>

    <input
      id="bookCover"
      type="url"
      placeholder="Paste an image URL"
    >

    <label>Book / PDF link</label>

    <input
      id="bookLink"
      type="url"
      placeholder="Paste your PDF or book link"
    >

    <label>Shelf</label>

    <select id="bookShelf">
      <option value="">Standalone</option>
    </select>

    <div class="modal-buttons">

      <button
        class="cancel-button"
        onclick="closeBookModal()"
      >
        Cancel
      </button>

      <button
        class="save-button"
        onclick="saveBook()"
      >
        Save Book
      </button>

    </div>

  </div>

</div>

<div class="modal" id="shelfModal">

  <div class="modal-box">

    <h2>
      Add Shelf
    </h2>

    <label>
      Series / Shelf name
    </label>

    <input
      id="shelfName"
      type="text"
      placeholder="e.g. Twisted Series"
    >

    <label>
      Shelf cover image URL
    </label>

    <input
      id="shelfCover"
      type="url"
      placeholder="Paste a cover image URL"
    >

    <div class="modal-buttons">

      <button
        class="cancel-button"
        onclick="closeShelfModal()"
      >
        Cancel
      </button>

      <button
        class="save-button"
        onclick="saveShelf()"
      >
        Create Shelf
      </button>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  updateDoc,
  onSnapshot,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {

  apiKey:
  "AIzaSyBl-5cfDXHTX0gHubxH9MZx2YwLDbRRKFs",

  authDomain:
  "myshelf-e3440.firebaseapp.com",

  projectId:
  "myshelf-e3440",

  storageBucket:
  "myshelf-e3440.firebasestorage.app",

  messagingSenderId:
  "820092826756",

  appId:
  "1:820092826756:web:0cab1578f5dfc3c74ebed1",

  measurementId:
  "G-LB8602RM3L"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

let currentUser = null;

let books = [];

let shelves = [];

let currentView = "all";

let currentShelf = null;

let editingBookId = null;

const content =
document.getElementById("content");

const shelfList =
document.getElementById("shelfList");

const allCount =
document.getElementById("allCount");

const favoriteCount =
document.getElementById("favoriteCount");

const totalText =
document.getElementById("totalText");

const pageTitle =
document.getElementById("pageTitle");

const bookShelf =
document.getElementById("bookShelf");

onAuthStateChanged(auth, user => {

  if (!user) {

    content.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔐</div>
        <h2>Sign in required</h2>
        <p>Please sign in to view your MyShelf library.</p>
      </div>
    `;

    return;
  }

  currentUser = user;

  startListeners();

});

function startListeners() {

  const userRef =
    doc(db, "users", currentUser.uid);

  const booksRef =
    collection(userRef, "books");

  const shelvesRef =
    collection(userRef, "shelves");


  onSnapshot(
    booksRef,
    snapshot => {

      books = [];

      snapshot.forEach(item => {

        books.push({
          id: item.id,
          ...item.data()
        });

      });

      render();

    },
    error => {

      console.error(error);

      content.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <h2>Couldn't load your books</h2>
          <p>${error.message}</p>
        </div>
      `;

    }
  );


  onSnapshot(
    shelvesRef,
    snapshot => {

      shelves = [];

      snapshot.forEach(item => {

        shelves.push({
          id: item.id,
          ...item.data()
        });

      });

      renderShelves();

      updateShelfSelect();

      render();

    }
  );

}

function renderShelves() {

  shelfList.innerHTML = "";

  shelves.forEach(shelf => {

    const div =
      document.createElement("div");

    div.className =
      "shelf-nav" +
      (currentView === "shelf" &&
       currentShelf === shelf.id
        ? " active"
        : "");

    div.innerHTML = `
      <span>${escapeHtml(shelf.name)}</span>
      <small>
        ${books.filter(
          b => b.shelfId === shelf.id
        ).length}
      </small>
    `;

    div.onclick = () => {

      currentView = "shelf";

      currentShelf = shelf.id;

      renderShelves();

      render();

    };

    shelfList.appendChild(div);

  });

}

function updateShelfSelect() {

  bookShelf.innerHTML =
    `<option value="">Standalone</option>`;

  shelves.forEach(shelf => {

    const option =
      document.createElement("option");

    option.value = shelf.id;

    option.textContent = shelf.name;

    bookShelf.appendChild(option);

  });

}

function render() {

  let visibleBooks = [...books];


  if (currentView === "favorites") {

    visibleBooks =
      visibleBooks.filter(
        book => book.favorite === true
      );

    pageTitle.textContent =
      "Favorites";

  }

  else if (currentView === "shelf") {

    const shelf =
      shelves.find(
        s => s.id === currentShelf
      );

    pageTitle.textContent =
      shelf ? shelf.name : "My Books";

    visibleBooks =
      visibleBooks.filter(
        book => book.shelfId === currentShelf
      );

  }

  else {

    pageTitle.textContent =
      "My Books";

  }


  const sort =
    document.getElementById("sortSelect").value;


  if (sort === "title") {

    visibleBooks.sort(
      (a,b) =>
        (a.title || "").localeCompare(
          b.title || ""
        )
    );

  }


  if (sort === "favorite") {

    visibleBooks.sort(
      (a,b) =>
        Number(b.favorite) -
        Number(a.favorite)
    );

  }


  allCount.textContent =
    books.length;

  favoriteCount.textContent =
    books.filter(
      b => b.favorite
    ).length;

  totalText.textContent =
    visibleBooks.length +
    (visibleBooks.length === 1
      ? " book"
      : " books");


  if (!visibleBooks.length) {

    content.innerHTML = `
      <div class="empty-state">

        <div class="empty-icon">
          📚
        </div>

        <h2>
          Your library is waiting
        </h2>

        <p>
          Add a book to start building your shelf.
        </p>

      </div>
    `;

    return;

  }


  content.innerHTML = `
    <div class="book-grid">
      ${visibleBooks.map(
        bookCard
      ).join("")}
    </div>
  `;

}

function bookCard(book) {

  const shelf =
    shelves.find(
      s => s.id === book.shelfId
    );


  return `
    <div class="book-card">

      <div class="cover">

        ${
          book.cover
          ?
          `<img
             src="${escapeAttribute(book.cover)}"
             alt=""
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
           >
           <div
             class="cover-placeholder"
             style="display:none"
           >
             📖
           </div>`
          :
          `<div class="cover-placeholder">
             📖
           </div>`
        }

      </div>


      <div class="book-info">

        <div class="book-title">
          ${escapeHtml(book.title || "Untitled")}
        </div>

        <div class="book-series">
          ${
            shelf
              ? escapeHtml(shelf.name)
              : "Standalone"
          }
        </div>


        <div class="book-actions">

          <button
            class="favorite ${
              book.favorite ? "active" : ""
            }"
            onclick="toggleFavorite('${book.id}')"
            title="Favorite"
          >
            ${book.favorite ? "♥" : "♡"}
          </button>


          <button
            class="menu-button"
            onclick="toggleMenu(event,'${book.id}')"
          >
            ⋮
          </button>

        </div>

      </div>


      <div
        class="menu"
        id="menu-${book.id}"
      >

        <button
          onclick="editBook('${book.id}')"
        >
          ✏️ Edit
        </button>

        <button
          class="delete"
          onclick="deleteBook('${book.id}')"
        >
          🗑️ Delete
        </button>

      </div>

    </div>
  `;

}

window.toggleFavorite =
async function(id) {

  if (!currentUser) return;

  const bookRef =
    doc(
      db,
      "users",
      currentUser.uid,
      "books",
      id
    );

  const book =
    books.find(
      b => b.id === id
    );

  if (!book) return;

  await updateDoc(
    bookRef,
    {
      favorite: !book.favorite
    }
  );

};

window.toggleMenu =
function(event,id) {

  event.stopPropagation();

  document
    .querySelectorAll(".menu")
    .forEach(menu => {

      if (
        menu.id !==
        "menu-" + id
      ) {

        menu.classList.remove("show");

      }

    });


  const menu =
    document.getElementById(
      "menu-" + id
    );

  menu.classList.toggle("show");

};

window.deleteBook =
async function(id) {

  const book =
    books.find(
      b => b.id === id
    );

  if (!book) return;

  const confirmed =
    confirm(
      `Delete "${book.title}"?`
    );

  if (!confirmed) return;

  await deleteDoc(
    doc(
      db,
      "users",
      currentUser.uid,
      "books",
      id
    )
  );

};

window.editBook =
function(id) {

  const book =
    books.find(
      b => b.id === id
    );

  if (!book) return;

  editingBookId = id;

  document.getElementById(
    "bookModalTitle"
  ).textContent =
    "Edit Book";

  document.getElementById(
    "bookTitle"
  ).value =
    book.title || "";

  document.getElementById(
    "bookCover"
  ).value =
    book.cover || "";

  document.getElementById(
    "bookLink"
  ).value =
    book.link || "";

  document.getElementById(
    "bookShelf"
  ).value =
    book.shelfId || "";

  document
    .getElementById("bookModal")
    .classList.add("show");

};

window.openBookModal =
function() {

  editingBookId = null;

  document.getElementById(
    "bookModalTitle"
  ).textContent =
    "Add Book";

  document.getElementById(
    "bookTitle"
  ).value = "";

  document.getElementById(
    "bookCover"
  ).value = "";

  document.getElementById(
    "bookLink"
  ).value = "";

  document.getElementById(
    "bookShelf"
  ).value = "";

  document
    .getElementById("bookModal")
    .classList.add("show");

};


window.closeBookModal =
function() {

  document
    .getElementById("bookModal")
    .classList.remove("show");

};

window.saveBook =
async function() {

  if (!currentUser) return;

  const title =
    document.getElementById(
      "bookTitle"
    ).value.trim();

  if (!title) {

    alert("Please enter a book title.");

    return;

  }

  const cover =
    document.getElementById(
      "bookCover"
    ).value.trim();

  const link =
    document.getElementById(
      "bookLink"
    ).value.trim();

  const shelfId =
    document.getElementById(
      "bookShelf"
    ).value;


  if (editingBookId) {

    await updateDoc(
      doc(
        db,
        "users",
        currentUser.uid,
        "books",
        editingBookId
      ),
      {
        title,
        cover,
        link,
        shelfId
      }
    );

  }

  else {

    await addDoc(
      collection(
        db,
        "users",
        currentUser.uid,
        "books"
      ),
      {
        title,
        cover,
        link,
        shelfId,
        favorite: false,
        createdAt:
          serverTimestamp()
      }
    );

  }

  closeBookModal();

};

window.openShelfModal =
function() {

  document.getElementById(
    "shelfName"
  ).value = "";

  document.getElementById(
    "shelfCover"
  ).value = "";

  document
    .getElementById("shelfModal")
    .classList.add("show");

};


window.closeShelfModal =
function() {

  document
    .getElementById("shelfModal")
    .classList.remove("show");

};


window.saveShelf =
async function() {

  if (!currentUser) return;

  const name =
    document.getElementById(
      "shelfName"
    ).value.trim();

  const cover =
    document.getElementById(
      "shelfCover"
    ).value.trim();

  if (!name) {

    alert("Please enter a shelf name.");

    return;

  }


  await addDoc(
    collection(
      db,
      "users",
      currentUser.uid,
      "shelves"
    ),
    {
      name,
      cover,
      createdAt:
        serverTimestamp()
    }
  );


  closeShelfModal();

};

window.showAllBooks =
function() {

  currentView = "all";

  currentShelf = null;

  render();

  renderShelves();

};

window.showFavorites =
function() {

  currentView = "favorites";

  currentShelf = null;

  render();

  renderShelves();

};

document
  .getElementById("sortSelect")
  .addEventListener(
    "change",
    render
  );

document.addEventListener(
  "click",
  () => {

    document
      .querySelectorAll(".menu")
      .forEach(menu =>
        menu.classList.remove("show")
      );

  }
);

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return escapeHtml(value);

}

</script>
