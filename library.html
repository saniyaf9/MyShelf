<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">



<!-- GOOGLE PICKER -->

<script src="https://apis.google.com/js/api.js"></script>

<script src="https://accounts.google.com/gsi/client"></script>


<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  min-height: 100%;

  background: #080f13;
  color: #f9f9f9;

  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
}

button,
input {
  font-family: Arial, sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

header {

  height: 78px;

  padding: 0 6%;

  display: flex;

  align-items: center;

  justify-content: space-between;

  border-bottom: 1px solid #263238;

  position: sticky;

  top: 0;

  z-index: 50;

  background: rgba(8,15,19,.97);

  backdrop-filter: blur(10px);

}

.logo {

  font-family: Georgia, serif;

  font-size: 29px;

}


/* =====================================================
   MAIN
===================================================== */

main {

  width: min(1100px, 88%);

  margin: auto;

  padding: 60px 0 100px;

}

.eyebrow {

  color: #7f8c91;

  font-size: 10px;

  letter-spacing: 4px;

  text-transform: uppercase;

  margin-bottom: 12px;

}

h1 {

  margin: 0;

  font-family: Georgia, serif;

  font-size: clamp(45px, 7vw, 75px);

  font-weight: 400;

  letter-spacing: -3px;

}

.description {

  max-width: 570px;

  margin-top: 18px;

  color: #7f8c91;

  font-size: 14px;

  line-height: 1.7;

}


/* =====================================================
   TOP BUTTONS
===================================================== */

.top-actions {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-top: 30px;

}

.primary {

  border: none;

  background: #f9f9f9;

  color: #080f13;

  padding: 12px 20px;

  border-radius: 25px;

  cursor: pointer;

  font-weight: 600;

}

.primary:hover {

  opacity: .82;

}

.secondary {

  border: 1px solid #35434a;

  background: transparent;

  color: white;

  padding: 11px 19px;

  border-radius: 25px;

  cursor: pointer;

  font-weight: 600;

}

.secondary:hover {

  background: #101a1f;

}


/* =====================================================
   TABS
===================================================== */

.tabs {

  display: flex;

  gap: 5px;

  margin-top: 60px;

  border-bottom: 1px solid #263238;

}

.tab {

  border: none;

  background: transparent;

  color: #68767b;

  padding: 14px 18px;

  border-bottom: 2px solid transparent;

  cursor: pointer;

  font-size: 12px;

}

.tab:hover {

  color: white;

}

.tab.active {

  color: white;

  border-bottom-color: white;

}


/* =====================================================
   SECTION
===================================================== */

.section {

  margin-top: 42px;

}

.section-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 20px;

  margin-bottom: 20px;

}

.section-heading {

  min-width: 0;

}

.section-title {

  font-family: Georgia, serif;

  font-size: 29px;

}

.section-count {

  margin-top: 5px;

  color: #68767b;

  font-size: 11px;

}

.section-add {

  flex-shrink: 0;

  padding: 9px 16px;

  font-size: 12px;

  white-space: nowrap;

}


/* =====================================================
   SERIES GRID
===================================================== */

.series-grid {

  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(270px, 1fr));

  gap: 16px;

}


/* =====================================================
   SERIES TILE
===================================================== */

.series-card {

  position: relative;

  min-height: 145px;

  border: 1px solid #29373d;

  border-radius: 14px;

  background: #0d171c;

  transition: .2s;

  overflow: visible;

}

.series-card:hover {

  border-color: #536168;

  transform: translateY(-2px);

}

.series-card-content {

  padding: 23px;

  padding-right: 60px;

}

.series-icon {

  width: 46px;

  height: 46px;

  border-radius: 11px;

  background: #17242a;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 21px;

  margin-bottom: 18px;

}

.series-name {

  font-family: Georgia, serif;

  font-size: 21px;

  word-break: break-word;

}

.series-books {

  margin-top: 6px;

  color: #718087;

  font-size: 11px;

}

.open-series {

  margin: 0 23px 20px;

  width: calc(100% - 46px);

}


/* =====================================================
   THREE DOT MENU
===================================================== */

.menu-wrapper {

  position: absolute;

  top: 14px;

  right: 14px;

  z-index: 20;

}

.menu-button {

  width: 35px;

  height: 35px;

  border: 1px solid #35434a;

  border-radius: 9px;

  background: #091115;

  color: #aeb8bc;

  font-size: 20px;

  line-height: 1;

  cursor: pointer;

}

.menu-button:hover {

  color: white;

  border-color: #68767b;

}

.menu {

  display: none;

  position: absolute;

  top: 41px;

  right: 0;

  width: 150px;

  padding: 6px;

  background: #101a1f;

  border: 1px solid #35434a;

  border-radius: 10px;

  box-shadow: 0 15px 40px rgba(0,0,0,.55);

  z-index: 100;

}

.menu.show {

  display: block;

}

.menu-item {

  width: 100%;

  border: none;

  background: transparent;

  color: #dce1e3;

  padding: 10px;

  text-align: left;

  border-radius: 7px;

  cursor: pointer;

}

.menu-item:hover {

  background: #1b292f;

}

.menu-item.delete {

  color: #ff8f8f;

}


/* =====================================================
   BOOK LIST
===================================================== */

.book-list {

  display: flex;

  flex-direction: column;

  gap: 10px;

}

.book {

  min-height: 76px;

  padding: 12px 15px;

  border: 1px solid #26343a;

  border-radius: 13px;

  background: #0d171c;

  display: flex;

  align-items: center;

  gap: 13px;

  position: relative;

}

.book-cover {

  width: 46px;

  height: 56px;

  border-radius: 7px;

  background: #17242a;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 21px;

  flex-shrink: 0;

}

.book-info {

  flex: 1;

  min-width: 0;

}

.book-title {

  font-family: Georgia, serif;

  font-size: 17px;

  word-break: break-word;

}

.book-meta {

  color: #68767b;

  font-size: 10px;

  margin-top: 5px;

}


/* =====================================================
   FAVORITE HEART
===================================================== */

.favorite-button {

  width: 48px;

  height: 48px;

  border: 1px solid #35434a;

  border-radius: 50%;

  background: transparent;

  color: #7b888d;

  font-size: 29px;

  line-height: 1;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

  flex-shrink: 0;

  transition: .18s;

}

.favorite-button:hover {

  border-color: white;

  color: white;

  transform: scale(1.08);

}

.favorite-button.active {

  color: white;

  border-color: white;

}

.favorite-button.active:hover {

  background: #17242a;

}


/* =====================================================
   BOOK THREE DOTS
===================================================== */

.book-menu-wrapper {

  position: relative;

  flex-shrink: 0;

}

.book-menu-button {

  width: 39px;

  height: 39px;

  border: 1px solid #35434a;

  border-radius: 9px;

  background: transparent;

  color: #9aa5a9;

  font-size: 20px;

  cursor: pointer;

}

.book-menu-button:hover {

  color: white;

  background: #17242a;

}


/* =====================================================
   OPEN BOOK BUTTON
===================================================== */

.open-book {

  border: 1px solid #35434a;

  background: transparent;

  color: white;

  padding: 9px 13px;

  border-radius: 8px;

  cursor: pointer;

  font-size: 11px;

}

.open-book:hover {

  background: #17242a;

}


/* =====================================================
   EMPTY
===================================================== */

.empty {

  border: 1px dashed #2b3940;

  border-radius: 18px;

  padding: 55px 25px;

  text-align: center;

}

.empty-icon {

  font-size: 43px;

  margin-bottom: 13px;

}

.empty h2 {

  margin: 0;

  font-family: Georgia, serif;

  font-size: 28px;

  font-weight: 400;

}

.empty p {

  color: #718087;

  font-size: 13px;

  line-height: 1.6;

  margin: 11px auto 22px;

  max-width: 400px;

}


/* =====================================================
   SERIES PAGE
===================================================== */

#seriesPage {

  display: none;

}

.back {

  border: none;

  background: transparent;

  color: #718087;

  padding: 0;

  cursor: pointer;

  margin-bottom: 28px;

}

.back:hover {

  color: white;

}

.series-page-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 20px;

  margin-bottom: 35px;

}

.series-heading {

  display: flex;

  align-items: center;

  gap: 15px;

}

.series-heading-icon {

  width: 60px;

  height: 60px;

  border-radius: 15px;

  background: #17242a;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 27px;

}

.series-heading h2 {

  margin: 0;

  font-family: Georgia, serif;

  font-size: 34px;

  font-weight: 400;

}

.series-heading p {

  margin: 5px 0 0;

  color: #718087;

  font-size: 11px;

}


/* =====================================================
   MODAL
===================================================== */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 200;

  background: rgba(0,0,0,.82);

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.modal.show {

  display: flex;

}

.modal-box {

  width: 100%;

  max-width: 440px;

  padding: 30px;

  background: #0f191e;

  border: 1px solid #35434a;

  border-radius: 18px;

}

.modal-box h2 {

  margin: 0 0 25px;

  font-family: Georgia, serif;

  font-size: 28px;

  font-weight: 400;

}

.field {

  margin-bottom: 17px;

}

.field label {

  display: block;

  color: #718087;

  font-size: 10px;

  text-transform: uppercase;

  letter-spacing: 1px;

  margin-bottom: 7px;

}

.field input {

  width: 100%;

  height: 46px;

  padding: 0 13px;

  border: 1px solid #303e44;

  border-radius: 8px;

  background: #091115;

  color: white;

  outline: none;

}

.field input:focus {

  border-color: #68767b;

}


/* =====================================================
   DRIVE PICKER BUTTON
===================================================== */

.drive-picker-button {

  width: 100%;

  height: 48px;

  border: 1px solid #35434a;

  border-radius: 9px;

  background: #101a1f;

  color: white;

  cursor: pointer;

  font-size: 13px;

  font-weight: 600;

}

.drive-picker-button:hover {

  background: #17242a;

  border-color: #68767b;

}

.drive-selected {

  margin-top: 10px;

  color: #9da8ad;

  font-size: 11px;

  min-height: 16px;

}


/* =====================================================
   MODAL BUTTONS
===================================================== */

.modal-actions {

  display: flex;

  gap: 10px;

  margin-top: 22px;

}

.modal-actions button {

  flex: 1;

  height: 43px;

  border-radius: 9px;

  cursor: pointer;

}

.cancel {

  border: 1px solid #35434a;

  background: transparent;

  color: white;

}

.create {

  border: none;

  background: white;

  color: #080f13;

  font-weight: 600;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

  header {

    padding: 0 20px;

  }

  main {

    width: 90%;

    padding-top: 45px;

  }

  .section-header {

    align-items: flex-start;

  }

  .series-page-header {

    display: block;

  }

  .series-page-header .primary {

    margin-top: 20px;

  }

  .book {

    gap: 8px;

  }

  .book-cover {

    width: 38px;

    height: 48px;

  }

  .favorite-button {

    width: 43px;

    height: 43px;

    font-size: 25px;

  }

  .open-book {

    display: none;

  }

}

</style>

</head>


<body>

<main>


<!-- =================================================
     HOME PAGE
================================================= -->

<div id="homePage">


  <h1>
    My Library
  </h1>


  <p class="description">

    Every series gets a shelf.
    Every standalone gets its own place.
    Keep your favorites close and build
    your collection your way.

  </p>

  <!-- =================================================
       TABS
  ================================================== -->

  <div class="tabs">

    <button
      id="allTab"
      class="tab active"
      onclick="showAll()">

      ALL BOOKS

    </button>


    <button
      id="favoritesTab"
      class="tab"
      onclick="showFavorites()">

      ♥ FAVORITES

    </button>

  </div>


  <!-- =================================================
       ALL CONTENT
  ================================================== -->

  <div id="allContent">


    <!-- =================================================
         SERIES SECTION
    ================================================== -->

    <section class="section">


      <div class="section-header">


        <div class="section-heading">

          <div class="section-title">
            📚 Series
          </div>

          <div
            id="seriesCount"
            class="section-count">

            0 series

          </div>

        </div>


        <!-- ALWAYS PRESENT -->

        <button
          class="secondary section-add"
          onclick="openSeriesModal()">

          ＋ Add Series

        </button>


      </div>


      <div
        id="seriesGrid"
        class="series-grid">

      </div>


    </section>



    <!-- =================================================
         STANDALONE SECTION
    ================================================== -->

    <section class="section">


      <div class="section-header">


        <div class="section-heading">

          <div class="section-title">
            📖 Standalone Books
          </div>

          <div
            id="standaloneCount"
            class="section-count">

            0 books

          </div>

        </div>


        <!-- ALWAYS PRESENT -->

        <button
          class="secondary section-add"
          onclick="openStandaloneModal()">

          ＋ Add Standalone Book

        </button>


      </div>


      <div
        id="standaloneList"
        class="book-list">

      </div>


    </section>


  </div>


  <!-- =================================================
       FAVORITES SECTION
  ================================================== -->

  <div
    id="favoritesContent"
    style="display:none;">


    <section class="section">


      <div class="section-header">

        <div class="section-heading">

          <div class="section-title">
            ♥ Favorite Books
          </div>

          <div
            id="favoritesCount"
            class="section-count">

            0 favorites

          </div>

        </div>

      </div>


      <div
        id="favoritesList"
        class="book-list">

      </div>


    </section>


  </div>


</div>



<!-- =================================================
     SERIES PAGE
================================================= -->

<div id="seriesPage">


  <button
    class="back"
    onclick="goHome()">

    ← Back to My Library

  </button>


  <div class="series-page-header">


    <div class="series-heading">


      <div
        class="series-heading-icon">

        📚

      </div>


      <div>

        <h2 id="seriesPageName">
          Series
        </h2>


        <p id="seriesPageCount">
          0 books
        </p>

      </div>


    </div>


    <!-- ALWAYS PRESENT INSIDE SERIES -->

    <button
      class="primary"
      onclick="addBookToCurrentSeries()">

      ＋ Add Book from Drive

    </button>


  </div>


  <div
    id="seriesBookList"
    class="book-list">

  </div>


</div>


</main>



<!-- =================================================
     CREATE SERIES MODAL
================================================= -->

<div
  id="seriesModal"
  class="modal">


  <div class="modal-box">


    <h2>
      Create a Series Shelf
    </h2>


    <div class="field">


      <label>
        Series name
      </label>


      <input
        id="seriesName"
        type="text"
        placeholder="Example: Made Series"
        autocomplete="off">


    </div>


    <div class="modal-actions">


      <button
        class="cancel"
        onclick="closeSeriesModal()">

        Cancel

      </button>


      <button
        class="create"
        onclick="createSeries()">

        Create Series

      </button>


    </div>


  </div>


</div>



<!-- =================================================
     STANDALONE BOOK MODAL
================================================= -->

<div
  id="standaloneModal"
  class="modal">


  <div class="modal-box">


    <h2>
      Add Standalone Book
    </h2>


    <!-- ONLY OPTION 1 -->

    <div class="field">


      <label>
        Book title
      </label>


      <input
        id="standaloneTitle"
        type="text"
        placeholder="Enter book title"
        autocomplete="off">


    </div>


    <!-- ONLY OPTION 2 -->

    <button
      type="button"
      class="drive-picker-button"
      onclick="pickStandaloneFromDrive()">

      📁 Pick from Google Drive

    </button>


    <div
      id="standaloneDriveSelected"
      class="drive-selected">

    </div>


    <div class="modal-actions">


      <button
        class="cancel"
        onclick="closeStandaloneModal()">

        Cancel

      </button>


      <button
        class="create"
        onclick="addStandaloneBook()">

        Add Book

      </button>


    </div>


  </div>


</div>



<script>


/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
  "myshelf_final_library_v1";


let library =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || {

    series: [],

    standalone: []

  };


let currentSeriesId =
  null;


let selectedDriveFile =
  null;


let drivePickerLoaded =
  false;

const API_KEY =
  "AIzaSyC4pGowo0fDjk8TJe-x-O7lCUlIj6JNgpU";


const CLIENT_ID =
  "1074521299867-4s2f8vm53iru10r72il166l0h63lvt0c.apps.googleusercontent.com";


const APP_ID =
  "820092826756";


const DRIVE_SCOPE =
  "https://www.googleapis.com/auth/drive.readonly";


let tokenClient =
  null;

let accessToken =
  null;


/* =====================================================
   SAVE
===================================================== */

function save() {

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(library)

  );

}


/* =====================================================
   SERIES MODAL
===================================================== */

function openSeriesModal() {

  document
    .getElementById("seriesName")
    .value = "";


  document
    .getElementById("seriesModal")
    .classList
    .add("show");


  setTimeout(
    function() {

      document
        .getElementById("seriesName")
        .focus();

    },
    50
  );

}


function closeSeriesModal() {

  document
    .getElementById("seriesModal")
    .classList
    .remove("show");

}


/* =====================================================
   CREATE SERIES
===================================================== */

function createSeries() {

  const input =
    document.getElementById("seriesName");


  const name =
    input.value.trim();


  if (!name) {

    alert(
      "Please enter a series name."
    );

    input.focus();

    return;

  }


  library.series.push({

    id:
      Date.now().toString(),

    name:
      name,

    books:
      []

  });


  save();


  input.value =
    "";


  closeSeriesModal();


  renderAll();

}


/* =====================================================
   STANDALONE MODAL
===================================================== */

function openStandaloneModal() {

  selectedDriveFile =
    null;


  document
    .getElementById("standaloneTitle")
    .value = "";


  document
    .getElementById("standaloneDriveSelected")
    .textContent = "";


  document
    .getElementById("standaloneModal")
    .classList
    .add("show");


  setTimeout(
    function() {

      document
        .getElementById("standaloneTitle")
        .focus();

    },
    50
  );

}


function closeStandaloneModal() {

  document
    .getElementById("standaloneModal")
    .classList
    .remove("show");

}


/* =====================================================
   DRIVE PICKER LOAD
===================================================== */

function loadDrivePicker() {

  if (
    typeof gapi ===
    "undefined"
  ) {

    return;

  }


  gapi.load(
    "picker",
    function() {

      drivePickerLoaded =
        true;

    }
  );

}


loadDrivePicker();


/* =====================================================
   DRIVE AUTHORIZATION
===================================================== */

function startDriveAuthorization(
  callback
) {

  if (
    API_KEY.includes(
      "PASTE_YOUR"
    ) ||
    CLIENT_ID.includes(
      "PASTE_YOUR"
    )
  ) {

    alert(
      "Add your existing Google API Key and OAuth Client ID at the top of the JavaScript first."
    );

    return;

  }


  if (
    typeof google ===
    "undefined"
  ) {

    alert(
      "Google Identity Services has not loaded yet."
    );

    return;

  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:
        CLIENT_ID,

      scope:
        DRIVE_SCOPE,

      callback:
        function(response) {


          if (
            response.error
          ) {

            console.error(
              response
            );


            alert(
              "Google authorization failed."
            );

            return;

          }


          accessToken =
            response.access_token;


          callback();

        }

    });


  tokenClient.requestAccessToken({

    prompt:
      "consent"

  });

}


/* =====================================================
   OPEN DRIVE PICKER
===================================================== */

function openDrivePicker(
  callback
) {

  if (
    !drivePickerLoaded
  ) {

    alert(
      "Google Drive Picker is still loading. Please try again in a moment."
    );

    return;

  }


  if (
    !accessToken
  ) {

    startDriveAuthorization(
      function() {

        openDrivePicker(
          callback
        );

      }
    );

    return;

  }


  const view =
    new google.picker.DocsView(
      google.picker.ViewId.DOCS
    );


  view.setIncludeFolders(
    false
  );


  view.setMimeTypes(
    "application/pdf"
  );


  const picker =
    new google.picker.PickerBuilder()

      .setDeveloperKey(
        API_KEY
      )

      .setAppId(
        APP_ID
      )

      .setOAuthToken(
        accessToken
      )

      .addView(
        view
      )

      .setCallback(
        function(data) {

          if (
            data.action ===
            google.picker.Action.PICKED
          ) {

            const file =
              data.docs[0];


            callback(
              file
            );

          }

        }
      )

      .build();


  picker.setVisible(
    true
  );

}


/* =====================================================
   PICK STANDALONE FROM DRIVE
===================================================== */

function pickStandaloneFromDrive() {

  openDrivePicker(

    function(file) {


      selectedDriveFile =
        file;


      document
        .getElementById(
          "standaloneDriveSelected"
        )
        .textContent =
          "Selected: " +
          file.name;


      /*
        If the title field is empty,
        automatically use the Drive
        file name as the title.
      */

      const titleInput =
        document
          .getElementById(
            "standaloneTitle"
          );


      if (
        !titleInput.value.trim()
      ) {

        titleInput.value =
          file.name
            .replace(
              /\.pdf$/i,
              ""
            );

      }

    }

  );

}


/* =====================================================
   ADD STANDALONE BOOK
===================================================== */

function addStandaloneBook() {

  const title =
    document
      .getElementById(
        "standaloneTitle"
      )
      .value
      .trim();


  if (!title) {

    alert(
      "Please enter a book title."
    );

    return;

  }


  library.standalone.push({

    id:
      Date.now().toString(),

    title:
      title,

    driveFileId:
      selectedDriveFile
        ? selectedDriveFile.id
        : null,

    driveUrl:
      selectedDriveFile
        ? (
            selectedDriveFile.url ||
            selectedDriveFile.embedUrl ||
            ""
          )
        : "",

    favorite:
      false

  });


  save();


  selectedDriveFile =
    null;


  closeStandaloneModal();


  renderAll();

}


/* =====================================================
   ADD BOOK TO SERIES
===================================================== */

function addBookToCurrentSeries() {

  if (
    !currentSeriesId
  ) {

    return;

  }


  openDrivePicker(

    function(file) {


      const series =
        library.series.find(
          function(s) {

            return (
              s.id ===
              currentSeriesId
            );

          }
        );


      if (!series) {

        return;

      }


      const title =
        file.name
          .replace(
            /\.pdf$/i,
            ""
          );


      series.books.push({

        id:
          Date.now().toString(),

        title:
          title,

        driveFileId:
          file.id,

        driveUrl:
          file.url ||
          file.embedUrl ||
          "",

        favorite:
          false

      });


      save();


      renderAll();


      renderSeriesPage();

    }

  );

}


/* =====================================================
   OPEN SERIES
===================================================== */

function openSeries(
  id
) {

  const series =
    library.series.find(
      function(s) {

        return (
          s.id === id
        );

      }
    );


  if (!series) {

    return;

  }


  currentSeriesId =
    id;


  document
    .getElementById(
      "homePage"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "seriesPage"
    )
    .style.display =
      "block";


  renderSeriesPage();

}


/* =====================================================
   SERIES PAGE
===================================================== */

function renderSeriesPage() {

  const series =
    library.series.find(
      function(s) {

        return (
          s.id ===
          currentSeriesId
        );

      }
    );


  if (!series) {

    return;

  }


  document
    .getElementById(
      "seriesPageName"
    )
    .textContent =
      series.name;


  document
    .getElementById(
      "seriesPageCount"
    )
    .textContent =
      series.books.length +
      (
        series.books.length === 1
          ? " book"
          : " books"
      );


  const list =
    document.getElementById(
      "seriesBookList"
    );


  list.innerHTML =
    "";


  if (
    series.books.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📖
        </div>

        <h2>
          This shelf is empty
        </h2>

        <p>
          Add a book from Google Drive.
        </p>

        <button
          class="primary"
          onclick="addBookToCurrentSeries()">

          ＋ Add Book from Drive

        </button>

      </div>

    `;

    return;

  }

[...library.series].reverse().forEach(
    book => {

      list.appendChild(
        createBookElement(
          book,
          series
        )
      );

    }
  );

}


/* =====================================================
   GO HOME
===================================================== */

function goHome() {

  currentSeriesId =
    null;


  document
    .getElementById(
      "seriesPage"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "homePage"
    )
    .style.display =
      "block";


  showAll();

}


/* =====================================================
   RENDER ALL
===================================================== */

function renderAll() {

  renderSeries();

  renderStandalone();

  renderFavorites();

}


/* =====================================================
   RENDER SERIES
===================================================== */

function renderSeries() {

  const grid =
    document.getElementById(
      "seriesGrid"
    );


  grid.innerHTML =
    "";


  document
    .getElementById(
      "seriesCount"
    )
    .textContent =
      library.series.length +
      (
        library.series.length === 1
          ? " series"
          : " series"
      );


  if (
    library.series.length === 0
  ) {

    grid.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;">

        <div class="empty-icon">
          📚
        </div>

        <h2>
          No series yet
        </h2>

        <p>
          Create your first series shelf.
        </p>

      </div>

    `;

    return;

  }


  library.series
  .slice()
  .reverse()
  .forEach(
    function(series) {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "series-card";


      card.innerHTML = `

        <div class="series-card-content">

          <div class="series-icon">
            📚
          </div>

          <div class="series-name">
            ${escapeHTML(series.name)}
          </div>

          <div class="series-books">

            ${series.books.length}

            ${
              series.books.length === 1
                ? "book"
                : "books"
            }

          </div>

        </div>


        <!-- THREE DOTS -->

        <div class="menu-wrapper">

          <button
            class="menu-button"
            onclick="toggleMenu(event, 'series-menu-${series.id}')">

            ⋯

          </button>


          <div
            id="series-menu-${series.id}"
            class="menu">

            <button
              class="menu-item"
              onclick="editSeries('${series.id}')">

              Edit name

            </button>


            <button
              class="menu-item delete"
              onclick="deleteSeries('${series.id}')">

              Delete series

            </button>

          </div>

        </div>


        <button
          class="primary open-series"
          onclick="openSeries('${series.id}')">

          Open Shelf →

        </button>

      `;


      grid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   RENDER STANDALONE
===================================================== */

function renderStandalone() {

  const list =
    document.getElementById(
      "standaloneList"
    );


  list.innerHTML =
    "";


  document
    .getElementById(
      "standaloneCount"
    )
    .textContent =
      library.standalone.length +
      (
        library.standalone.length === 1
          ? " book"
          : " books"
      );


  if (
    library.standalone.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📖
        </div>

        <h2>
          No standalone books
        </h2>

        <p>
          Add a standalone book from
          Google Drive.
        </p>

      </div>

    `;

    return;

  }

[...library.standalone].reverse().forEach(
  function(book) {

    list.appendChild(
      createBookElement(
        book,
        null
      )
    );

  }
);
}


/* =====================================================
   CREATE BOOK ELEMENT
===================================================== */

function createBookElement(
  book,
  series
) {

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "book";


  const seriesName =
    series
      ? series.name
      : "Standalone book";


  const driveButton =
    book.driveUrl
      ? `

        <button
          class="open-book"
          onclick="openBook('${book.id}')">

          Open

        </button>

      `
      : "";


  row.innerHTML = `

    <div class="book-cover">
      📖
    </div>


    <div class="book-info">

      <div class="book-title">
        ${escapeHTML(book.title)}
      </div>

      <div class="book-meta">
        ${escapeHTML(seriesName)}
      </div>

    </div>


    <!-- HEART -->

    <button
      class="favorite-button ${
        book.favorite
          ? "active"
          : ""
      }"
      onclick="toggleFavorite(
        '${series ? series.id : ""}',
        '${book.id}'
      )"
      aria-label="Favorite">

      ${
        book.favorite
          ? "♥"
          : "♡"
      }

    </button>


    ${driveButton}


    <!-- THREE DOTS -->

    <div class="book-menu-wrapper">

      <button
        class="book-menu-button"
        onclick="toggleMenu(event, 'book-menu-${book.id}')">

        ⋯

      </button>


      <div
        id="book-menu-${book.id}"
        class="menu">

        <button
          class="menu-item"
          onclick="editBook(
            '${series ? series.id : ""}',
            '${book.id}'
          )">

          Edit title

        </button>


        <button
          class="menu-item delete"
          onclick="deleteBook(
            '${series ? series.id : ""}',
            '${book.id}'
          )">

          Delete book

        </button>

      </div>

    </div>

  `;


  return row;

}


/* =====================================================
   FAVORITE
===================================================== */

function toggleFavorite(
  seriesId,
  bookId
) {

  let book =
    null;


  if (seriesId) {

    const series =
      library.series.find(
        function(s) {

          return (
            s.id ===
            seriesId
          );

        }
      );


    if (series) {

      book =
        series.books.find(
          function(b) {

            return (
              b.id ===
              bookId
            );

          }
        );

    }

  }

  else {

    book =
      library.standalone.find(
        function(b) {

          return (
            b.id ===
            bookId
          );

        }
      );

  }


  if (!book) {

    return;

  }


  book.favorite =
    !Boolean(
      book.favorite
    );


  save();


  renderAll();


  if (
    currentSeriesId
  ) {

    renderSeriesPage();

  }

}


/* =====================================================
   FAVORITES
===================================================== */

function showFavorites() {

  document
    .getElementById(
      "allContent"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "favoritesContent"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "allTab"
    )
    .classList
    .remove("active");


  document
    .getElementById(
      "favoritesTab"
    )
    .classList
    .add("active");


  renderFavorites();

}


function showAll() {

  document
    .getElementById(
      "allContent"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "favoritesContent"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "allTab"
    )
    .classList
    .add("active");


  document
    .getElementById(
      "favoritesTab"
    )
    .classList
    .remove("active");

}


function renderFavorites() {

  const list =
    document.getElementById(
      "favoritesList"
    );


  list.innerHTML =
    "";


  let count =
    0;


  library.series.forEach(
    function(series) {

      series.books.forEach(
        function(book) {

          if (
            book.favorite
          ) {

            count++;


            list.appendChild(

              createBookElement(
                book,
                series
              )

            );

          }

        }
      );

    }
  );


  library.standalone.forEach(
    function(book) {

      if (
        book.favorite
      ) {

        count++;


        list.appendChild(

          createBookElement(
            book,
            null
          )

        );

      }

    }
  );


  document
    .getElementById(
      "favoritesCount"
    )
    .textContent =
      count +
      (
        count === 1
          ? " favorite"
          : " favorites"
      );


  if (
    count === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ♡
        </div>

        <h2>
          No favorites yet
        </h2>

        <p>
          Click the heart beside a book
          to add it here.
        </p>

      </div>

    `;

  }

}


/* =====================================================
   EDIT SERIES
===================================================== */

function editSeries(
  id
) {

  const series =
    library.series.find(
      function(s) {

        return (
          s.id === id
        );

      }
    );


  if (!series) {

    return;

  }


  const newName =
    prompt(
      "Edit series name:",
      series.name
    );


  if (
    newName !== null &&
    newName.trim()
  ) {

    series.name =
      newName.trim();


    save();

    renderAll();


    if (
      currentSeriesId === id
    ) {

      renderSeriesPage();

    }

  }

}


/* =====================================================
   DELETE SERIES
===================================================== */

function deleteSeries(
  id
) {

  const series =
    library.series.find(
      function(s) {

        return (
          s.id === id
        );

      }
    );


  if (!series) {

    return;

  }


  const message =
    series.books.length > 0

      ? "Delete this series and all books inside it?"

      : "Delete this series?";


  if (
    !confirm(message)
  ) {

    return;

  }


  library.series =
    library.series.filter(
      function(s) {

        return (
          s.id !== id
        );

      }
    );


  save();

  renderAll();


  if (
    currentSeriesId === id
  ) {

    goHome();

  }

}


/* =====================================================
   EDIT BOOK
===================================================== */

function editBook(
  seriesId,
  bookId
) {

  let book =
    null;


  if (seriesId) {

    const series =
      library.series.find(
        function(s) {

          return (
            s.id ===
            seriesId
          );

        }
      );


    if (series) {

      book =
        series.books.find(
          function(b) {

            return (
              b.id ===
              bookId
            );

          }
        );

    }

  }

  else {

    book =
      library.standalone.find(
        function(b) {

          return (
            b.id ===
            bookId
          );

        }
      );

  }


  if (!book) {

    return;

  }


  const newTitle =
    prompt(
      "Edit book title:",
      book.title
    );


  if (
    newTitle !== null &&
    newTitle.trim()
  ) {

    book.title =
      newTitle.trim();


    save();

    renderAll();


    if (
      currentSeriesId
    ) {

      renderSeriesPage();

    }

  }

}


/* =====================================================
   DELETE BOOK
===================================================== */

function deleteBook(
  seriesId,
  bookId
) {

  if (
    !confirm(
      "Delete this book?"
    )
  ) {

    return;

  }


  if (seriesId) {

    const series =
      library.series.find(
        function(s) {

          return (
            s.id ===
            seriesId
          );

        }
      );


    if (series) {

      series.books =
        series.books.filter(
          function(book) {

            return (
              book.id !==
              bookId
            );

          }
        );

    }

  }

  else {

    library.standalone =
      library.standalone.filter(
        function(book) {

          return (
            book.id !==
            bookId
          );

        }
      );

  }


  save();

  renderAll();


  if (
    currentSeriesId
  ) {

    renderSeriesPage();

  }

}


/* =====================================================
   OPEN DRIVE BOOK
===================================================== */

function openBook(
  bookId
) {

  let book =
    null;


  library.standalone.forEach(
    function(item) {

      if (
        item.id ===
        bookId
      ) {

        book =
          item;

      }

    }
  );


  library.series.forEach(
    function(series) {

      series.books.forEach(
        function(item) {

          if (
            item.id ===
            bookId
          ) {

            book =
              item;

          }

        }
      );

    }
  );


  if (
    book &&
    book.driveUrl
  ) {

    window.open(
      book.driveUrl,
      "_blank"
    );

  }

}


/* =====================================================
   THREE DOT MENU
===================================================== */

function toggleMenu(
  event,
  menuId
) {

  event.stopPropagation();


  document
    .querySelectorAll(
      ".menu.show"
    )
    .forEach(
      function(menu) {

        if (
          menu.id !==
          menuId
        ) {

          menu.classList
            .remove(
              "show"
            );

        }

      }
    );


  const menu =
    document.getElementById(
      menuId
    );


  if (menu) {

    menu.classList.toggle(
      "show"
    );

  }

}


document.addEventListener(
  "click",
  function() {

    document
      .querySelectorAll(
        ".menu.show"
      )
      .forEach(
        function(menu) {

          menu.classList
            .remove(
              "show"
            );

        }
      );

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ENTER KEY
===================================================== */


/* CREATE SERIES WITH ENTER */

document
  .getElementById(
    "seriesName"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        createSeries();

      }

    }
  );


/* ADD STANDALONE WITH ENTER */

document
  .getElementById(
    "standaloneTitle"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        addStandaloneBook();

      }

    }
  );


/* =====================================================
   ESCAPE CLOSES MODALS
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Escape"
    ) {

      closeSeriesModal();

      closeStandaloneModal();

    }

  }
);


/* =====================================================
   CLICK OUTSIDE MODALS
===================================================== */

document
  .getElementById(
    "seriesModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeSeriesModal();

      }

    }
  );


document
  .getElementById(
    "standaloneModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeStandaloneModal();

      }

    }
  );


/* =====================================================
   INITIAL LOAD
===================================================== */

renderAll();

</script>


</body>

</html>
