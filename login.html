<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyShelf — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080f13;
      color: #f9f9f9;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 25px;
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .tagline {
      text-align: center;
      color: #aab3b8;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    .box {
      background: #101a20;
      border: 1px solid #26343b;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d8dfe2;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #33434b;
      background: #080f13;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #8faebc;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-btn {
      background: #f9f9f9;
      color: #080f13;
    }

    .google-btn {
      background: #ffffff;
      color: #222;
      margin-top: 12px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: #718089;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #29373e;
    }

    .switch {
      text-align: center;
      margin-top: 22px;
      color: #9ba8ae;
      font-size: 14px;
    }

    .switch span {
      color: #ffffff;
      cursor: pointer;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #b9c4c9;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">MyShelf</div>
  <div class="tagline">YOUR LITTLE LIBRARY</div>

  <div class="box">

    <!-- LOGIN -->
    <div id="loginForm">

      <h2>Welcome back</h2>

      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Enter your email">

      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password">

      <button class="main-btn" onclick="login()">
        Log In
      </button>

      <div class="divider">OR</div>

      <button class="google-btn" onclick="googleLogin()">
        Continue with Google
      </button>

      <div class="switch">
        Don't have an account?
        <span onclick="showSignup()">Sign Up</span>
      </div>

      <div id="loginMessage" class="message"></div>

    </div>


    <!-- SIGN UP -->
    <div id="signupForm" class="hidden">

      <h2>Create your account</h2>

      <!-- NAME FIELD -->
      <label>Name</label>
      <input
        type="text"
        id="signupName"
        placeholder="Enter your name"
      >

      <label>Email</label>
      <input
        type="email"
        id="signupEmail"
        placeholder="Enter your email"
      >

      <label>Password</label>
      <input
        type="password"
        id="signupPassword"
        placeholder="Create a password"
      >

      <label>Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
      >

      <button class="main-btn" onclick="signup()">
        Create Account
      </button>

      <div class="divider">OR</div>

      <button class="google-btn" onclick="googleLogin()">
        Continue with Google
      </button>

      <div class="switch">
        Already have an account?
        <span onclick="showLogin()">Log In</span>
      </div>

      <div id="signupMessage" class="message"></div>

    </div>

  </div>

</div>


<script>

  function showSignup() {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("signupForm").classList.remove("hidden");
  }

  function showLogin() {
    document.getElementById("signupForm").classList.add("hidden");
    document.getElementById("loginForm").classList.remove("hidden");
  }


  function signup() {

    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("signupMessage");

    if (name === "") {
      message.textContent = "Please enter your name.";
      return;
    }

    if (email === "") {
      message.textContent = "Please enter your email.";
      return;
    }

    if (password === "") {
      message.textContent = "Please create a password.";
      return;
    }

    if (password !== confirmPassword) {
      message.textContent = "Passwords do not match.";
      return;
    }

    message.textContent = "Account details look good!";

    /*
      Firebase account creation will go here.
    */
  }


  function login() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    const message = document.getElementById("loginMessage");

    if (email === "" || password === "") {
      message.textContent = "Please enter your email and password.";
      return;
    }

    /*
      Firebase login will go here.
    */

    message.textContent = "Login details entered.";
  }


  function googleLogin() {

    /*
      Your Google/Firebase sign-in code will go here.
    */

    alert("Google Sign-In will be connected here.");

  }

</script>

</body>
</html>
