<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyShelf - Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080f13;
    color: #f9f9f9;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.auth-container {
    width: 420px;
    max-width: 90%;
    background: #101a20;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
}

.tagline {
    text-align: center;
    color: #aeb8bd;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

.tabs {
    display: flex;
    margin-bottom: 25px;
    border-bottom: 1px solid #26343b;
}

.tab {
    flex: 1;
    padding: 13px;
    background: none;
    border: none;
    color: #89969c;
    font-size: 16px;
    cursor: pointer;
}

.tab.active {
    color: #f9f9f9;
    border-bottom: 2px solid #f9f9f9;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    border: 1px solid #29373e;
    border-radius: 9px;
    background: #0b1318;
    color: white;
    outline: none;
}

input:focus {
    border-color: #718089;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #f9f9f9;
    color: #080f13;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

.submit-btn:hover {
    opacity: 0.9;
}

.google-btn {
    width: 100%;
    padding: 13px;
    border: 1px solid #35434a;
    border-radius: 9px;
    background: #101a20;
    color: #f9f9f9;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 14px;
}

.google-btn:hover {
    background: #17232a;
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: #718089;
    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #29373e;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-size: 13px;
    min-height: 18px;
}
</style>
</head>

<body>

<div class="auth-container">

    <div class="logo">MyShelf</div>

    <div class="tagline">
        YOUR LITTLE LIBRARY
    </div>

    <!-- TABS -->
    <div class="tabs">

        <button
            class="tab active"
            onclick="showForm('signup', this)"
        >
            Sign Up
        </button>

        <button
            class="tab"
            onclick="showForm('login', this)"
        >
            Log In
        </button>

    </div>


    <!-- ========================= -->
    <!-- SIGN UP -->
    <!-- ========================= -->

    <div id="signup" class="form active">

        <label for="signupName">
            Name
        </label>

        <input
            type="text"
            id="signupName"
            placeholder="Enter your name"
        >


        <label for="signupEmail">
            Email
        </label>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
        >


        <label for="signupPassword">
            Password
        </label>

        <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
        >


        <button
            class="submit-btn"
            onclick="signup()"
        >
            Create Account
        </button>


        <div class="divider">
            OR
        </div>


        <button
            class="google-btn"
            onclick="googleSignIn()"
        >
            Continue with Google
        </button>


        <div
            id="signupMessage"
            class="message"
        ></div>

    </div>


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <div id="login" class="form">

        <label for="loginEmail">
            Email
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
        >


        <label for="loginPassword">
            Password
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
        >


        <button
            class="submit-btn"
            onclick="login()"
        >
            Log In
        </button>


        <div class="divider">
            OR
        </div>


        <button
            class="google-btn"
            onclick="googleSignIn()"
        >
            Continue with Google
        </button>


        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>

</div>


<!-- ========================================= -->
<!-- FIREBASE -->
<!-- ========================================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   YOUR FIREBASE CONFIG
   ========================================= */

const firebaseConfig = {

    apiKey: "AIzaSyBl-5cfDXHTX0gHubxH9MZx2YwLDbRRKFs",

    authDomain: "myshelf-e3440.firebaseapp.com",

    projectId: "myshelf-e3440",

    storageBucket: "myshelf-e3440.firebasestorage.app",

    messagingSenderId: "820092826756",

    appId: "1:820092826756:web:0cab1578f5dfc3c74ebed1",

    measurementId: "G-LB8602RM3L"

};


/* =========================================
   INITIALIZE FIREBASE
   ========================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const googleProvider = new GoogleAuthProvider();


/* =========================================
   SWITCH BETWEEN SIGN UP AND LOGIN
   ========================================= */

window.showForm = function(formName, button) {

    document.querySelectorAll(".form").forEach(form => {
        form.classList.remove("active");
    });

    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
    });

    document
        .getElementById(formName)
        .classList.add("active");

    button.classList.add("active");
};


/* =========================================
   SIGN UP WITH EMAIL + PASSWORD
   ========================================= */

window.signup = async function() {

    const name =
        document.getElementById("signupName")
        .value
        .trim();

    const email =
        document.getElementById("signupEmail")
        .value
        .trim();

    const password =
        document.getElementById("signupPassword")
        .value;

    const message =
        document.getElementById("signupMessage");


    message.textContent = "";


    if (!name || !email || !password) {

        message.textContent =
            "Please fill in all fields.";

        return;
    }


    if (password.length < 6) {

        message.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    try {

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await updateProfile(
            userCredential.user,
            {
                displayName: name
            }
        );


        message.textContent =
            "Account created!";


        setTimeout(() => {

            window.location.href =
                "https://saniyaf9.github.io/MyShelf/library.html";

        }, 700);


    } catch (error) {

        console.error(error);

        message.textContent =
            getFirebaseError(error);
    }

};


/* =========================================
   LOGIN WITH EMAIL + PASSWORD
   ========================================= */

window.login = async function() {

    const email =
        document.getElementById("loginEmail")
        .value
        .trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    const message =
        document.getElementById("loginMessage");


    message.textContent = "";


    if (!email || !password) {

        message.textContent =
            "Please enter your email and password.";

        return;
    }


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        message.textContent =
            "Logging in...";


        setTimeout(() => {

            window.location.href =
                "https://saniyaf9.github.io/MyShelf/library.html";

        }, 500);


    } catch (error) {

        console.error(error);

        message.textContent =
            getFirebaseError(error);
    }

};


/* =========================================
   GOOGLE SIGN IN
   ========================================= */

window.googleSignIn = async function() {

    const signupMessage =
        document.getElementById("signupMessage");

    const loginMessage =
        document.getElementById("loginMessage");


    signupMessage.textContent = "";
    loginMessage.textContent = "";


    try {

        const result =
            await signInWithPopup(
                auth,
                googleProvider
            );


        console.log(
            "Google account signed in:",
            result.user
        );


        window.location.href =
            "https://saniyaf9.github.io/MyShelf/library.html";


    } catch (error) {

        console.error(error);


        const activeMessage =
            document.querySelector(
                ".form.active .message"
            );


        if (activeMessage) {

            activeMessage.textContent =
                getFirebaseError(error);

        }

    }

};


/* =========================================
   FIREBASE ERROR MESSAGES
   ========================================= */

function getFirebaseError(error) {

    switch (error.code) {

        case "auth/email-already-in-use":
            return "This email already has an account.";

        case "auth/invalid-email":
            return "Please enter a valid email.";

        case "auth/weak-password":
            return "Password must be at least 6 characters.";

        case "auth/invalid-credential":
            return "Incorrect email or password.";

        case "auth/user-not-found":
            return "No account found with this email.";

        case "auth/popup-closed-by-user":
            return "Google sign-in was cancelled.";

        case "auth/popup-blocked":
            return "Your browser blocked the Google sign-in popup.";

        case "auth/unauthorized-domain":
            return "This website is not authorized in Firebase.";

        case "auth/operation-not-allowed":
            return "Google Sign-In is not enabled in Firebase.";

        default:
            return "Something went wrong. Please try again.";

    }

}

</script>

</body>
</html>
