<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MyShelf Drive</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;

  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 90%;
  max-width: 420px;
  text-align: center;
}

.logo {
  font-size: 36px;
  font-weight: bold;
  margin-bottom: 8px;
}

.subtitle {
  color: #777;
  font-size: 13px;
  margin-bottom: 30px;
}

#driveButton {
  width: 100%;
  padding: 14px;

  background: white;
  color: black;

  border: none;
  border-radius: 8px;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
}

#driveButton:hover {
  opacity: .85;
}

#status {
  margin-top: 18px;
  color: #888;
  font-size: 13px;
}

</style>

</head>


<body>


<div class="container">

  <div class="logo">
    MyShelf
  </div>

  <div class="subtitle">
    Choose books from your Google Drive
  </div>

  <button id="driveButton">
    Choose from Google Drive
  </button>

  <div id="status">
    Loading...
  </div>

</div>


<script src="https://apis.google.com/js/api.js"></script>

<script src="https://accounts.google.com/gsi/client"></script>


<script>

const API_KEY =
"AIzaSyC4pGowo0fDjk8TJe-x-O7lCUlIj6JNgpU";


const CLIENT_ID =
"1074521299867-4s2f8vm53iru10r72il166l0h63lvt0c.apps.googleusercontent.com";


const APP_ID =
"1074521299867";


const SCOPES =
"https://www.googleapis.com/auth/drive.readonly";


let pickerLoaded = false;

let accessToken = null;


const status =
document.getElementById("status");


function showStatus(text) {

  status.textContent = text;

}


/* LOAD PICKER */

gapi.load(
  "picker",
  function() {

    pickerLoaded = true;

    showStatus("Ready.");

  }
);

function startGoogleLogin() {

  showStatus(
    "Connecting to Google..."
  );


  const tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope: SCOPES,

      callback: function(response) {


        if (response.error) {

          console.error(response);

          showStatus(
            "Google authorization failed."
          );

          return;

        }


        accessToken =
          response.access_token;


        openPicker();

      }

    });


  tokenClient.requestAccessToken({

    prompt: "consent"

  });

}


function openPicker() {


  if (!pickerLoaded) {

    showStatus(
      "Please wait for Google Picker to load."
    );

    return;

  }


  const view =
    new google.picker.DocsView(
      google.picker.ViewId.DOCS
    );


  view.setIncludeFolders(false);


  const picker =
    new google.picker.PickerBuilder()

      .setDeveloperKey(API_KEY)

      .setAppId(APP_ID)

      .setOAuthToken(accessToken)

      .addView(view)

      .enableFeature(
        google.picker.Feature.MULTISELECT_ENABLED
      )

      .setCallback(pickerCallback)

      .build();


  picker.setVisible(true);

}

function pickerCallback(data) {


  if (
    data.action ===
    google.picker.Action.PICKED
  ) {


    const files =
      data.docs;


    console.log(
      "Selected files:",
      files
    );


    showStatus(
      files.length +
      " file(s) selected."
    );

/

  }


  if (
    data.action ===
    google.picker.Action.CANCEL
  ) {

    showStatus(
      "Picker closed."
    );

  }

}

document
.getElementById("driveButton")
.addEventListener(
  "click",
  startGoogleLogin
);

</script>


</body>

</html>
