<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyShelf - Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080f13;
    color: #f9f9f9;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.auth-container {
    width: 420px;
    max-width: 90%;
    background: #101a20;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
}

.tagline {
    text-align: center;
    color: #aeb8bd;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

.tabs {
    display: flex;
    margin-bottom: 25px;
    border-bottom: 1px solid #26343b;
}

.tab {
    flex: 1;
    padding: 13px;
    background: none;
    border: none;
    color: #89969c;
    font-size: 16px;
    cursor: pointer;
}

.tab.active {
    color: #f9f9f9;
    border-bottom: 2px solid #f9f9f9;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    border: 1px solid #29373e;
    border-radius: 9px;
    background: #0b1318;
    color: white;
    outline: none;
}

input:focus {
    border-color: #718089;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #f9f9f9;
    color: #080f13;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

.submit-btn:hover {
    opacity: 0.9;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-size: 13px;
    min-height: 18px;
}
</style>
</head>

<body>

<div class="auth-container">

    <div class="logo">MyShelf</div>
    <div class="tagline">YOUR LITTLE LIBRARY</div>

    <!-- SIGN UP FIRST -->
    <div class="tabs">
        <button class="tab active" onclick="showForm('signup', this)">
            Sign Up
        </button>

        <button class="tab" onclick="showForm('login', this)">
            Log In
        </button>
    </div>

    <!-- SIGN UP -->
    <div id="signup" class="form active">

        <label for="signupName">Name</label>
        <input
            type="text"
            id="signupName"
            placeholder="Enter your name"
        >

        <label for="signupEmail">Email</label>
        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
        >

        <label for="signupPassword">Password</label>
        <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
        >

        <button class="submit-btn" onclick="signup()">
            Create Account
        </button>

        <div id="signupMessage" class="message"></div>

    </div>

    <!-- LOGIN -->
    <div id="login" class="form">

        <label for="loginEmail">Email</label>
        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
        >

        <label for="loginPassword">Password</label>
        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
        >

        <button class="submit-btn" onclick="login()">
            Log In
        </button>

        <div id="loginMessage" class="message"></div>

    </div>

</div>

<script>
function showForm(formName, button) {

    document.querySelectorAll(".form").forEach(form => {
        form.classList.remove("active");
    });

    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
    });

    document.getElementById(formName).classList.add("active");
    button.classList.add("active");
}


/*
   TEMPORARY LOCAL LOGIN SYSTEM

   This keeps the login page completely separate
   from library.html.

   When Firebase Authentication is connected,
   only signup() and login() need to be replaced.
*/

function signup() {

    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;

    const message = document.getElementById("signupMessage");

    if (!name || !email || !password) {
        message.textContent = "Please fill in all fields.";
        return;
    }

    localStorage.setItem("myshelf_user", JSON.stringify({
        name: name,
        email: email,
        password: password
    }));

    message.textContent = "Account created!";

    setTimeout(() => {
        showForm(
            "login",
            document.querySelectorAll(".tab")[1]
        );
    }, 700);
}


function login() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    const message = document.getElementById("loginMessage");

    const savedUser = JSON.parse(
        localStorage.getItem("myshelf_user")
    );

    if (!savedUser) {
        message.textContent = "No account found. Please sign up first.";
        return;
    }

    if (
        email !== savedUser.email ||
        password !== savedUser.password
    ) {
        message.textContent = "Incorrect email or password.";
        return;
    }

    localStorage.setItem("myshelf_logged_in", "true");

    /*
       IMPORTANT:
       Change this filename only if your library
       file has a different name.
    */
    window.location.href = "library.html";
}
</script>

</body>
</html>
