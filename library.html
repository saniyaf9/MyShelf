
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<!-- =====================================================
     GOOGLE PICKER
===================================================== -->

<script src="https://apis.google.com/js/api.js"></script>

<script src="https://accounts.google.com/gsi/client"></script>


<style>

/* =====================================================
   LOGIN PROTECTION
===================================================== */

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #080f13;
  color: #f9f9f9;
  font-family: Arial, sans-serif;
}

/*
   Keep the library hidden until Firebase confirms
   that the user is signed in.
*/

#libraryApp {
  display: none;
}


/* =====================================================
   GENERAL
===================================================== */

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
}

button,
input {
  font-family: Arial, sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

header {
  height: 78px;
  padding: 0 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #263238;
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(8,15,19,.97);
  backdrop-filter: blur(10px);
}

.logo {
  font-family: Georgia, serif;
  font-size: 29px;
}


/* =====================================================
   MAIN
===================================================== */

main {
  width: min(1100px, 88%);
  margin: auto;
  padding: 60px 0 100px;
}

.eyebrow {
  color: #7f8c91;
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: clamp(45px, 7vw, 75px);
  font-weight: 400;
  letter-spacing: -3px;
}

.description {
  max-width: 570px;
  margin-top: 18px;
  color: #7f8c91;
  font-size: 14px;
  line-height: 1.7;
}


/* =====================================================
   TOP BUTTONS
===================================================== */

.top-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 30px;
}

.primary {
  border: none;
  background: #162329;
  color: #ffffff;
  padding: 12px 20px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: 600;
  transition: all .2s ease;
}

.primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 20px rgba(255,255,255,.16);
}

.secondary {
  border: 1px solid #7f8c91;
  background: #ffffff;
  color: #080f13;
  padding: 11px 19px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: 600;
  box-shadow: 0 0 0 rgba(255,255,255,0);
  transition: all .2s ease;
}

.secondary:hover {
  background: #223139;
  border-color: #ffffff;
  color: white;
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(255,255,255,.08);
}


/* =====================================================
   TABS
===================================================== */

.tabs {
  display: flex;
  gap: 5px;
  margin-top: 60px;
  border-bottom: 1px solid #263238;
}

.tab {
  border: none;
  background: transparent;
  color: #68767b;
  padding: 14px 18px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  font-size: 12px;
}

.tab:hover {
  color: white;
}

.tab.active {
  color: white;
  border-bottom-color: white;
}


/* =====================================================
   SECTION
===================================================== */

.section {
  margin-top: 42px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
}

.section-heading {
  min-width: 0;
}

.section-title {
  font-family: Georgia, serif;
  font-size: 29px;
}

.section-count {
  margin-top: 5px;
  color: #68767b;
  font-size: 11px;
}

.section-add {
  flex-shrink: 0;
  padding: 9px 16px;
  font-size: 12px;
  white-space: nowrap;
}


/* =====================================================
   THREE COLUMN GRIDS
===================================================== */

.series-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.book-tile-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.favorite-tile-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}


/* =====================================================
   SERIES TILE
===================================================== */

.series-card {
  position: relative;
  min-height: 50px;
  border: 1px solid #29373d;
  border-radius: 14px;
  background: #0d171c;
  background-size: cover;
  background-position: center;
  transition: .2s;
  overflow: visible;
  z-index: 1;
  cursor: pointer;
}

.series-card.has-background::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: rgba(8,15,19,.55);
  z-index: 0;
  pointer-events: none;
}

.series-card > * {
  position: relative;
  z-index: 1;
}

.series-card:hover {
  border-color: #536168;
  transform: translateY(-2px);
}

.series-card.menu-open {
  z-index: 10000;
}

.series-card-content {
  padding: 12px 16px;
  padding-right: 55px;
}

.series-name {
  font-family: Georgia, serif;
  font-size: 17px;
  word-break: break-word;
}

.series-books {
  margin-top: 6px;
  color: #718087;
  font-size: 11px;
}


/* =====================================================
   THREE DOT MENU
===================================================== */

.menu-wrapper {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 2000;
}

.menu-button {
  width: 35px;
  height: 35px;
  border: 1px solid #35434a;
  border-radius: 9px;
  background: #091115;
  color: #aeb8bc;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}

.menu-button:hover {
  color: white;
  border-color: #68767b;
}

.menu {
  display: none;
  position: absolute;
  top: 41px;
  right: 0;
  width: 155px;
  padding: 6px;
  background: #101a1f;
  border: 1px solid #35434a;
  border-radius: 10px;
  box-shadow: 0 15px 40px rgba(0,0,0,.65);
  z-index: 99999;
}

.menu.show {
  display: block;
}

.menu-item {
  width: 100%;
  border: none;
  background: transparent;
  color: #dce1e3;
  padding: 10px;
  text-align: left;
  border-radius: 7px;
  cursor: pointer;
}

.menu-item:hover {
  background: #1b292f;
}

.menu-item.delete {
  color: #ff8f8f;
}


/* =====================================================
   STANDALONE BOOK TILES
===================================================== */

.book-tile {
  position: relative;
  min-height: 50px;
  border: 1px solid #29373d;
  border-radius: 14px;
  background: #0d171c;
  background-size: cover;
  background-position: center;
  overflow: visible;
  transition: .2s;
  z-index: 1;
  cursor: pointer;
}

.book-tile:hover {
  border-color: #536168;
  transform: translateY(-2px);
}

.book-tile.menu-open {
  z-index: 10000;
}

.book-tile::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: linear-gradient(
    to bottom,
    rgba(8,15,19,.12),
    rgba(8,15,19,.82)
  );
  pointer-events: none;
}

.book-tile-content {
  position: relative;
  z-index: 2;
  min-height: 50px;
  padding: 12px 55px 12px 16px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.book-tile-title {
  font-family: Georgia, serif;
  font-size: 17px;
  word-break: break-word;
}

.book-tile-meta {
  margin-top: 6px;
  color: #aeb8bc;
  font-size: 10px;
}

.book-tile-actions {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 5;
  display: flex;
  gap: 7px;
}

.book-tile-actions .favorite-button {
  width: 35px;
  height: 35px;
  font-size: 21px;
  background: rgba(9,17,21,.82);
}

.book-tile-actions .book-menu-button {
  width: 35px;
  height: 35px;
  background: rgba(9,17,21,.82);
}

.book-tile .menu {
  top: 40px;
}

.book-tile-open {
  position: relative;
  z-index: 2;
  margin-top: 7px;
  border: 1px solid #35434a;
  background: rgba(9,17,21,.82);
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 11px;
  align-self: flex-start;
}

.book-tile-open:hover {
  background: #17242a;
}


/* =====================================================
   FAVORITE TILES
===================================================== */

.favorite-tile {
  position: relative;
  min-height: 50px;
  border: 1px solid #29373d;
  border-radius: 14px;
  background: #0d171c;
  background-size: cover;
  background-position: center;
  overflow: visible;
  transition: .2s;
  z-index: 1;
  cursor: pointer;
}

.favorite-tile:hover {
  border-color: #536168;
  transform: translateY(-2px);
}

.favorite-tile.menu-open {
  z-index: 10000;
}

.favorite-tile::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: linear-gradient(
    to bottom,
    rgba(8,15,19,.12),
    rgba(8,15,19,.82)
  );
  pointer-events: none;
}

.favorite-tile-content {
  position: relative;
  z-index: 2;
  min-height: 50px;
  padding: 12px 55px 12px 16px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.favorite-tile-title {
  font-family: Georgia, serif;
  font-size: 17px;
  word-break: break-word;
}

.favorite-tile-meta {
  margin-top: 6px;
  color: #aeb8bc;
  font-size: 10px;
}

.favorite-tile-actions {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 5;
  display: flex;
  gap: 7px;
}

.favorite-tile-actions .favorite-button {
  width: 35px;
  height: 35px;
  font-size: 21px;
  background: rgba(9,17,21,.82);
}

.favorite-tile-actions .book-menu-button {
  width: 35px;
  height: 35px;
  background: rgba(9,17,21,.82);
}

.favorite-tile .menu {
  top: 40px;
}


/* =====================================================
   BOOK LIST
===================================================== */

.book-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.book {
  min-height: 76px;
  padding: 12px 15px;
  border: 1px solid #26343a;
  border-radius: 13px;
  background: #0d171c;
  display: flex;
  align-items: center;
  gap: 13px;
  position: relative;
}

.book-cover {
  width: 46px;
  height: 56px;
  border-radius: 7px;
  background: #17242a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  flex-shrink: 0;
}

.book-info {
  flex: 1;
  min-width: 0;
}

.book-title {
  font-family: Georgia, serif;
  font-size: 17px;
  word-break: break-word;
}

.book-meta {
  color: #68767b;
  font-size: 10px;
  margin-top: 5px;
}


/* =====================================================
   FAVORITE HEART
===================================================== */

.favorite-button {
  width: 48px;
  height: 48px;
  border: 1px solid #35434a;
  border-radius: 50%;
  background: transparent;
  color: #7b888d;
  font-size: 29px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: .18s;
}

.favorite-button:hover {
  border-color: white;
  color: white;
  transform: scale(1.08);
}

.favorite-button.active {
  color: white;
  border-color: white;
}

.favorite-button.active:hover {
  background: #17242a;
}


/* =====================================================
   BOOK THREE DOTS
===================================================== */

.book-menu-wrapper {
  position: relative;
  flex-shrink: 0;
}

.book-menu-button {
  width: 39px;
  height: 39px;
  border: 1px solid #35434a;
  border-radius: 9px;
  background: transparent;
  color: #9aa5a9;
  font-size: 20px;
  cursor: pointer;
}

.book-menu-button:hover {
  color: white;
  background: #17242a;
}


/* =====================================================
   OPEN BOOK
===================================================== */

.open-book {
  border: 1px solid #35434a;
  background: transparent;
  color: white;
  padding: 9px 13px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 11px;
}

.open-book:hover {
  background: #17242a;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {
  border: 1px dashed #2b3940;
  border-radius: 18px;
  padding: 55px 25px;
  text-align: center;
}

.empty-icon {
  font-size: 43px;
  margin-bottom: 13px;
}

.empty h2 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 28px;
  font-weight: 400;
}

.empty p {
  color: #718087;
  font-size: 13px;
  line-height: 1.6;
  margin: 11px auto 22px;
  max-width: 400px;
}


/* =====================================================
   SERIES PAGE
===================================================== */

#seriesPage {
  display: none;
}

.back {
  border: none;
  background: transparent;
  color: #718087;
  padding: 0;
  cursor: pointer;
  margin-bottom: 28px;
}

.back:hover {
  color: white;
}

.series-page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 35px;
}

.series-heading {
  display: flex;
  align-items: center;
  gap: 15px;
}

.series-heading h2 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 34px;
  font-weight: 400;
}

.series-heading p {
  margin: 5px 0 0;
  color: #718087;
  font-size: 11px;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,.82);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 440px;
  padding: 30px;
  background: #0f191e;
  border: 1px solid #35434a;
  border-radius: 18px;
}

.modal-box h2 {
  margin: 0 0 25px;
  font-family: Georgia, serif;
  font-size: 28px;
  font-weight: 400;
}

.field {
  margin-bottom: 17px;
}

.field label {
  display: block;
  color: #718087;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 7px;
}

.field input {
  width: 100%;
  height: 46px;
  padding: 0 13px;
  border: 1px solid #303e44;
  border-radius: 8px;
  background: #091115;
  color: white;
  outline: none;
}

.field input:focus {
  border-color: #68767b;
}


/* =====================================================
   DRIVE PICKER
===================================================== */

.drive-picker-button {
  width: 100%;
  height: 48px;
  border: 1px solid #35434a;
  border-radius: 9px;
  background: #101a1f;
  color: white;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.drive-picker-button:hover {
  background: #17242a;
  border-color: #68767b;
}

.drive-selected {
  margin-top: 10px;
  color: #9da8ad;
  font-size: 11px;
  min-height: 16px;
}


/* =====================================================
   MODAL BUTTONS
===================================================== */

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.modal-actions button {
  flex: 1;
  height: 43px;
  border-radius: 9px;
  cursor: pointer;
}

.cancel {
  border: 1px solid #35434a;
  background: transparent;
  color: white;
}

.create {
  border: none;
  background: white;
  color: #080f13;
  font-weight: 600;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

  header {
    padding: 0 20px;
  }

  main {
    width: 90%;
    padding-top: 45px;
  }

  .section-header {
    align-items: flex-start;
  }

  .series-page-header {
    display: block;
  }

  .series-page-header .primary {
    margin-top: 20px;
  }

  .series-grid,
  .book-tile-grid,
  .favorite-tile-grid {
    grid-template-columns: 1fr;
  }

  .book {
    gap: 8px;
  }

  .book-cover {
    width: 38px;
    height: 48px;
  }

  .favorite-button {
    width: 43px;
    height: 43px;
    font-size: 25px;
  }

  .open-book {
    display: none;
  }

}


/* =====================================================
   ADD BUTTON POP
===================================================== */

@keyframes addButtonPop {

  0% {
    transform: scale(1);
  }

  40% {
    transform: scale(1.08);
  }

  70% {
    transform: scale(0.97);
  }

  100% {
    transform: scale(1);
  }

}

.add-button-pop {
  animation: addButtonPop 0.45s ease;
}

</style>

</head>


<body>


<!-- =====================================================
     EVERYTHING INSIDE HERE IS PROTECTED
===================================================== -->

<div id="libraryApp">

<main>


<!-- =================================================
     HOME PAGE
================================================= -->

<div id="homePage">

  <h1>
    My Library
  </h1>

  <p class="description">
    Every series gets a shelf.
    Every standalone gets its own place.
    Keep your favorites close and build
    your collection your way.
  </p>


  <!-- TABS -->

  <div class="tabs">

    <button
      id="seriesTab"
      class="tab active"
      onclick="showSeries()">

      📚 SERIES

    </button>

    <button
      id="booksTab"
      class="tab"
      onclick="showBooks()">

      📖 BOOKS

    </button>

    <button
      id="favoritesTab"
      class="tab"
      onclick="showFavorites()">

      ♥ FAVORITES

    </button>

  </div>


  <!-- SERIES -->

  <div id="seriesContent">

    <section class="section">

      <div class="section-header">

        <div class="section-heading">

          <div class="section-title">
            📚 Series
          </div>

          <div
            id="seriesCount"
            class="section-count">

            0 series

          </div>

        </div>

        <button
          class="secondary section-add"
          onclick="openSeriesModal()">

          ＋ Add Series

        </button>

      </div>

      <div
        id="seriesGrid"
        class="series-grid">

      </div>

    </section>

  </div>


  <!-- BOOKS -->

  <div
    id="booksContent"
    style="display:none;">

    <section class="section">

      <div class="section-header">

        <div class="section-heading">

          <div class="section-title">
            📖 Standalone Books
          </div>

          <div
            id="standaloneCount"
            class="section-count">

            0 books

          </div>

        </div>

        <button
          class="secondary section-add"
          onclick="openStandaloneModal()">

          ＋ Add Standalone Book

        </button>

      </div>

      <div
        id="standaloneList"
        class="book-tile-grid">

      </div>

    </section>

  </div>


  <!-- FAVORITES -->

  <div
    id="favoritesContent"
    style="display:none;">

    <section class="section">

      <div class="section-header">

        <div class="section-heading">

          <div class="section-title">
            ♥ Favorite Books
          </div>

          <div
            id="favoritesCount"
            class="section-count">

            0 favorites

          </div>

        </div>

      </div>

      <div
        id="favoritesList"
        class="favorite-tile-grid">

      </div>

    </section>

  </div>

</div>


<!-- =================================================
     SERIES PAGE
================================================= -->

<div id="seriesPage">

  <button
    class="back"
    onclick="goHome()">

    ← Back to My Library

  </button>

  <div class="series-page-header">

    <div class="series-heading">

      <div>

        <h2 id="seriesPageName">
          Series
        </h2>

        <p id="seriesPageCount">
          0 books
        </p>

      </div>

    </div>

  </div>

  <div
    id="seriesBookList"
    class="book-list">

  </div>

</div>

</main>


<!-- =================================================
     CREATE SERIES MODAL
================================================= -->

<div
  id="seriesModal"
  class="modal">

  <div class="modal-box">

    <h2>
      Create a Series Shelf
    </h2>

    <div class="field">

      <label>
        Series name
      </label>

      <input
        id="seriesName"
        type="text"
        placeholder="Example: Made Series"
        autocomplete="off">

    </div>

    <div class="modal-actions">

      <button
        class="cancel"
        onclick="closeSeriesModal()">

        Cancel

      </button>

      <button
        class="create"
        onclick="createSeries()">

        Create Series

      </button>

    </div>

  </div>

</div>


<!-- =================================================
     STANDALONE BOOK MODAL
================================================= -->

<div
  id="standaloneModal"
  class="modal">

  <div class="modal-box">

    <h2>
      Add Standalone Book
    </h2>

    <div class="field">

      <label>
        Book title
      </label>

      <input
        id="standaloneTitle"
        type="text"
        placeholder="Enter book title"
        autocomplete="off">

    </div>

    <button
      type="button"
      class="drive-picker-button"
      onclick="pickStandaloneFromDrive()">

      📁 Pick from Google Drive

/* =====================================================
   DRIVE AUTHORIZATION
===================================================== */

function startDriveAuthorization(
  callback
) {

  if (
    API_KEY.includes("PASTE_YOUR") ||
    CLIENT_ID.includes("PASTE_YOUR")
  ) {

    alert(
      "Add your existing Google API Key and OAuth Client ID at the top of the JavaScript first."
    );

    return;

  }

  if (
    typeof google ===
    "undefined"
  ) {

    alert(
      "Google Identity Services has not loaded yet."
    );

    return;

  }

  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:
        CLIENT_ID,

      scope:
        DRIVE_SCOPE,

      callback:
        function(response) {

          if (
            response.error
          ) {

            console.error(
              response
            );

            alert(
              "Google authorization failed."
            );

            return;

          }

          accessToken =
            response.access_token;

          callback();

        }

    });

  tokenClient.requestAccessToken({

    prompt:
      "consent"

  });

}


/* =====================================================
   OPEN DRIVE PICKER
===================================================== */

function openDrivePicker(
  callback
) {

  if (
    !drivePickerLoaded
  ) {

    alert(
      "Google Drive Picker is still loading. Please try again in a moment."
    );

    return;

  }

  if (
    !accessToken
  ) {

    startDriveAuthorization(
      function() {

        openDrivePicker(
          callback
        );

      }
    );

    return;

  }

  const view =
    new google.picker.DocsView(
      google.picker.ViewId.DOCS
    );

  view.setIncludeFolders(
    false
  );

  view.setMimeTypes(
    "application/pdf"
  );

  const picker =
    new google.picker.PickerBuilder()

      .setDeveloperKey(
        API_KEY
      )

      .setAppId(
        APP_ID
      )

      .setOAuthToken(
        accessToken
      )

      .addView(
        view
      )

      .setCallback(
        function(data) {

          if (
            data.action ===
            google.picker.Action.PICKED
          ) {

            const file =
              data.docs[0];

            callback(
              file
            );

          }

        }
      )

      .build();

  picker.setVisible(
    true
  );

}

===================================================== */

function findBook(
  seriesId,
  bookId
) {

  if (seriesId) {

    const series =
      library.series.find(
        function(s) {

          return s.id === seriesId;

        }
      );

    if (!series) {

      return null;

    }

    return (
      series.books.find(
        function(b) {

          return b.id === bookId;

        }
      ) || null
    );

  }

  return (
    library.standalone.find(
      function(b) {

        return b.id === bookId;

      }
    ) || null
  );

}

    );

  if (
    newUrl === null
  ) {

    return;

  }

  book.backgroundUrl =
    newUrl.trim();

  save();

  renderAll();

  if (currentSeriesId) {

    renderSeriesPage();

  }

}


function removeBookBackground(
  seriesId,
  bookId
) {

  const book =
    findBook(
      seriesId,
      bookId
    );

  if (!book) {

    return;

  }

  book.backgroundUrl =
    "";

  save();

  renderAll();

  if (currentSeriesId) {

    renderSeriesPage();

  }

}


/* =====================================================
   FAVORITE
===================================================== */

function toggleFavorite(
  seriesId,
  bookId
) {

  const book =
    findBook(
      seriesId,
      bookId
    );

  if (!book) {

    return;

  }

  book.favorite =
    !Boolean(
      book.favorite
    );

  save();

  renderAll();

  if (
    currentSeriesId
  ) {

    renderSeriesPage();

  }

}


/* =====================================================
   TABS
===================================================== */

function showSeries() {

  document
    .getElementById("seriesContent")
    .style.display =
      "block";

  document
    .getElementById("booksContent")
    .style.display =
      "none";

  document
    .getElementById("favoritesContent")
    .style.display =
      "none";

  document
    .getElementById("seriesTab")
    .classList
    .add("active");

  document
    .getElementById("booksTab")
    .classList
    .remove("active");

  document
    .getElementById("favoritesTab")
    .classList
    .remove("active");

}


function showBooks() {

  document
    .getElementById("seriesContent")
    .style.display =
      "none";

  document
    .getElementById("booksContent")
    .style.display =
      "block";

  document
    .getElementById("favoritesContent")
    .style.display =
      "none";

  document
    .getElementById("seriesTab")
    .classList
    .remove("active");

  document
    .getElementById("booksTab")
    .classList
    .add("active");

  document
    .getElementById("favoritesTab")
    .classList
    .remove("active");

}


function showFavorites() {

  document
    .getElementById("seriesContent")
    .style.display =
      "none";

  document
    .getElementById("booksContent")
    .style.display =
      "none";

  document
    .getElementById("favoritesContent")
    .style.display =
      "block";

  document
    .getElementById("seriesTab")
    .classList
    .remove("active");

  document
    .getElementById("booksTab")
    .classList
    .remove("active");

  document
    .getElementById("favoritesTab")
    .classList
    .add("active");

  renderFavorites();

}


function showAll() {

  showSeries();

}


/* =====================================================
   RENDER FAVORITES
===================================================== */

function renderFavorites() {

  const list =
    document.getElementById(
      "favoritesList"
    );

  list.innerHTML =
    "";

  let count =
    0;

  library.series.forEach(
    function(series) {

      series.books.forEach(
        function(book) {

          if (
            !book.favorite
          ) {

            return;

          }

          count++;

          list.appendChild(
            createFavoriteTile(
              book,
              series
            )
          );

        }
      );

    }
  );

  library.standalone.forEach(
    function(book) {

      if (
        !book.favorite
      ) {

        return;

      }

      count++;

      list.appendChild(
        createFavoriteTile(
          book,
          null
        )
      );

    }
  );

  document
    .getElementById(
      "favoritesCount"
    )
    .textContent =
      count +
      (
        count === 1
          ? " favorite"
          : " favorites"
      );

  if (
    count === 0
  ) {

    list.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;">

        <div class="empty-icon">
          ♡
        </div>

        <h2>
          No favorites yet
        </h2>

        <p>
          Click the heart beside a book
          to add it here.
        </p>

      </div>

    `;

  }

}


/* =====================================================
   CREATE FAVORITE TILE
===================================================== */

function createFavoriteTile(
  book,
  series
) {

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "favorite-tile";

  card.style.cursor =
    "pointer";

  card.onclick =
    function(event) {

      if (
        event.target.closest(
          ".favorite-tile-actions"
        ) ||
        event.target.closest(
          ".menu"
        ) ||
        event.target.closest(
          ".book-tile-open"
        )
      ) {

        return;

      }

      openBook(
        book.id
      );

    };

  if (
    book.backgroundUrl
  ) {

    card.style.backgroundImage =
      `url("${book.backgroundUrl}")`;

  }

  const seriesName =
    series
      ? series.name
      : "Standalone book";

  const driveButton =
    book.driveUrl
      ? `

          <button
            class="book-tile-open"
            onclick="openBook(
              '${book.id}'
            )">

            Open

          </button>

        `
      : "";

  card.innerHTML = `

    <div class="favorite-tile-actions">

      <button
        class="favorite-button active"
        onclick="toggleFavorite(
          '${series ? series.id : ""}',
          '${book.id}'
        )"
        aria-label="Remove from favorites">

        ♥

      </button>

      <div class="book-menu-wrapper">

        <button
          class="book-menu-button"
          onclick="toggleMenu(
            event,
            'favorite-menu-${book.id}'
          )">

          ⋯

        </button>

        <div
          id="favorite-menu-${book.id}"
          class="menu">

          <button
            class="menu-item"
            onclick="editBook(
              '${series ? series.id : ""}',
              '${book.id}'
            )">

            Edit title

          </button>

          <button
            class="menu-item"
            onclick="changeBookBackground(
              '${series ? series.id : ""}',
              '${book.id}'
            )">

            Change Background

          </button>

          <button
            class="menu-item"
            onclick="removeBookBackground(
              '${series ? series.id : ""}',
              '${book.id}'
            )">

            Remove Background

          </button>

          <button
            class="menu-item delete"
            onclick="deleteBook(
              '${series ? series.id : ""}',
              '${book.id}'
            )">

            Delete book

          </button>

        </div>

      </div>

    </div>

    <div class="favorite-tile-content">

      <div class="favorite-tile-title">

        ${escapeHTML(book.title)}

      </div>

      <div class="favorite-tile-meta">

        ${escapeHTML(seriesName)}

      </div>

      ${driveButton}

    </div>

  `;

  return card;

}


/* =====================================================
   EDIT SERIES
===================================================== */

function editSeries(
  id
) {

  const series =
    library.series.find(
      function(s) {

        return (
          s.id === id
        );

      }
    );

  if (!series) {

    return;

  }

  const newName =
    prompt(
      "Edit series name:",
      series.name
    );

  if (
    newName !== null &&
    newName.trim()
  ) {

    series.name =
      newName.trim();

    save();

    renderAll();

    if (
      currentSeriesId === id
    ) {

      renderSeriesPage();

    }

  }

}


/* =====================================================
   DELETE SERIES
===================================================== */

function deleteSeries(
  id
) {

  const series =
    library.series.find(
      function(s) {

        return (
          s.id === id
        );

      }
    );

  if (!series) {

    return;

  }

  const message =
    series.books.length > 0
      ? "Delete this series and all books inside it?"
      : "Delete this series?";

  if (
    !confirm(message)
  ) {

    return;

  }

  library.series =
    library.series.filter(
      function(s) {

        return (
          s.id !== id
        );

      }
    );

  save();

  renderAll();

  if (
    currentSeriesId === id
  ) {

    goHome();

  }

}


/* =====================================================
   EDIT BOOK
===================================================== */

function editBook(
  seriesId,
  bookId
) {

  const book =
    findBook(
      seriesId,
      bookId
    );

  if (!book) {

    return;

  }

  const newTitle =
    prompt(
      "Edit book title:",
      book.title
    );

  if (
    newTitle !== null &&
    newTitle.trim()
  ) {

    book.title =
      newTitle.trim();

    save();

    renderAll();

    if (
      currentSeriesId
    ) {

      renderSeriesPage();

    }

  }

}


/* =====================================================
   DELETE BOOK
===================================================== */

function deleteBook(
  seriesId,
  bookId
) {

  if (
    !confirm(
      "Delete this book?"
    )
  ) {

    return;

  }

  if (seriesId) {

    const series =
      library.series.find(
        function(s) {

          return (
            s.id ===
            seriesId
          );

        }
      );

    if (series) {

      series.books =
        series.books.filter(
          function(book) {

            return (
              book.id !==
              bookId
            );

          }
        );

    }

  }

  else {

    library.standalone =
      library.standalone.filter(
        function(book) {

          return (
            book.id !==
            bookId
          );

        }
      );

  }

  save();

  renderAll();

  if (
    currentSeriesId
  ) {

    renderSeriesPage();

  }

}


/* =====================================================
   OPEN DRIVE BOOK
===================================================== */

function openBook(
  bookId
) {

  let book =
    null;

  library.standalone.forEach(
    function(item) {

      if (
        item.id === bookId
      ) {

        book =
          item;

      }

    }
  );

  library.series.forEach(
    function(series) {

      series.books.forEach(
        function(item) {

          if (
            item.id === bookId
          ) {

            book =
              item;

          }

        }
      );

    }
  );

  if (
    book &&
    book.driveUrl
  ) {

    window.open(
      book.driveUrl,
      "_blank"
    );

  }

}


/* =====================================================
   THREE DOT MENU
===================================================== */

function toggleMenu(
  event,
  menuId
) {

  event.stopPropagation();

  document
    .querySelectorAll(
      ".menu.show"
    )
    .forEach(
      function(menu) {

        if (
          menu.id !== menuId
        ) {

          menu.classList.remove(
            "show"
          );

          const oldCard =
            menu.closest(
              ".series-card, .book-tile, .favorite-tile"
            );

          if (oldCard) {

            oldCard.classList.remove(
              "menu-open"
            );

          }

        }

      }
    );

  const menu =
    document.getElementById(
      menuId
    );

  if (!menu) {

    return;

  }

  const card =
    menu.closest(
      ".series-card, .book-tile, .favorite-tile"
    );

  const isOpen =
    menu.classList.contains(
      "show"
    );

  if (isOpen) {

    menu.classList.remove(
      "show"
    );

    if (card) {

      card.classList.remove(
        "menu-open"
      );

    }

  }

  else {

    menu.classList.add(
      "show"
    );

    if (card) {

      card.classList.add(
        "menu-open"
      );

    }

  }

}


/* =====================================================
   CLOSE MENUS
===================================================== */

document.addEventListener(
  "click",
  function(event) {

    if (
      event.target.closest(
        ".menu, .menu-button, .book-menu-button"
      )
    ) {

      return;

    }

    document
      .querySelectorAll(
        ".menu.show"
      )
      .forEach(
        function(menu) {

          menu.classList.remove(
            "show"
          );

          const card =
            menu.closest(
              ".series-card, .book-tile, .favorite-tile"
            );

          if (card) {

            card.classList.remove(
              "menu-open"
            );

          }

        }
      );

  }
);


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Escape"
    ) {

      document
        .querySelectorAll(
          ".menu.show"
        )
        .forEach(
          function(menu) {

            menu.classList.remove(
              "show"
            );

            const card =
              menu.closest(
                ".series-card, .book-tile, .favorite-tile"
              );

            if (card) {

              card.classList.remove(
                "menu-open"
              );

            }

          }
        );

    }

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ENTER KEY
===================================================== */

document
  .getElementById(
    "seriesName"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        createSeries();

      }

    }
  );


document
  .getElementById(
    "standaloneTitle"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        addStandaloneBook();

      }

    }
  );


/* =====================================================
   ESCAPE CLOSES MODALS
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Escape"
    ) {

      closeSeriesModal();

      closeStandaloneModal();

    }

  }
);


/* =====================================================
   CLICK OUTSIDE MODALS
===================================================== */

document
  .getElementById(
    "seriesModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeSeriesModal();

      }

    }
  );


document
  .getElementById(
    "standaloneModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeStandaloneModal();

      }

    }
  );


/* =====================================================
   ADD BUTTON POP
===================================================== */

function popAddButton(
  button
) {

  if (!button) {

    return;

  }

  button.classList.remove(
    "add-button-pop"
  );

  void button.offsetWidth;

  button.classList.add(
    "add-button-pop"
  );

  setTimeout(
    function() {

      button.classList.remove(
        "add-button-pop"
      );

    },
    500
  );

}
