<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyShelf — My Library</title>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #080f13;
  color: #f9f9f9;
  font-family: Arial, sans-serif;
}

button,
input,
select {
  font-family: Arial, sans-serif;
}

header {
  height: 78px;
  padding: 0 6%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid #263238;

  position: sticky;
  top: 0;

  z-index: 50;

  background: rgba(8,15,19,.96);

  backdrop-filter: blur(10px);
}

.logo {
  font-family: Georgia, serif;
  font-size: 28px;
}

.add-books {
  background: #f9f9f9;
  color: #080f13;

  border: none;

  padding: 12px 20px;

  border-radius: 25px;

  font-size: 12px;

  font-weight: 600;

  text-decoration: none;
}

.add-books:hover {
  opacity: .8;
}

main {
  width: min(1100px, 88%);
  margin: auto;
  padding: 70px 0 100px;
}


/* =====================================================
   INTRO
===================================================== */

.eyebrow {
  color: #7f8c91;

  font-size: 10px;

  letter-spacing: 4px;

  text-transform: uppercase;

  margin-bottom: 12px;
}

h1 {
  margin: 0;

  font-family: Georgia, serif;

  font-size: clamp(45px, 7vw, 75px);

  font-weight: 400;

  letter-spacing: -3px;
}

.description {
  max-width: 560px;

  margin-top: 18px;

  color: #7f8c91;

  font-size: 14px;

  line-height: 1.7;
}


/* =====================================================
   TOP BUTTONS
===================================================== */

.actions {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-top: 30px;
}

.primary {
  border: none;

  background: #f9f9f9;

  color: #080f13;

  padding: 12px 20px;

  border-radius: 25px;

  font-weight: 600;

  cursor: pointer;
}

.primary:hover {
  opacity: .8;
}

.secondary {
  border: 1px solid #35434a;

  background: transparent;

  color: white;

  padding: 11px 19px;

  border-radius: 25px;

  cursor: pointer;
}


/* =====================================================
   TABS
===================================================== */

.tabs {
  display: flex;

  gap: 5px;

  margin-top: 65px;

  border-bottom: 1px solid #263238;
}

.tab {
  border: none;

  background: transparent;

  color: #68767b;

  padding: 14px 18px;

  border-bottom: 2px solid transparent;

  cursor: pointer;

  font-size: 12px;
}

.tab:hover {
  color: white;
}

.tab.active {
  color: white;

  border-bottom-color: white;
}


/* =====================================================
   SECTION
===================================================== */

.section {
  margin-top: 40px;
}

.section-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 20px;
}

.section-title {
  font-family: Georgia, serif;

  font-size: 29px;
}

.section-count {
  color: #68767b;

  font-size: 11px;
}


/* =====================================================
   SERIES GRID
===================================================== */

.series-grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(260px, 1fr));

  gap: 18px;
}


/* =====================================================
   SERIES CARD
===================================================== */

.series-card {
  border: 1px solid #26343a;

  background: #0d171c;

  border-radius: 18px;

  overflow: hidden;

  transition: .2s;
}

.series-card:hover {
  border-color: #536168;

  transform: translateY(-2px);
}

.series-top {
  padding: 25px;

  background:
    linear-gradient(
      135deg,
      #17242a,
      #0d171c
    );
}

.series-icon {
  width: 50px;
  height: 50px;

  border-radius: 13px;

  background: #091115;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 24px;

  margin-bottom: 20px;
}

.series-name {
  font-family: Georgia, serif;

  font-size: 22px;
}

.series-count {
  margin-top: 7px;

  color: #718087;

  font-size: 11px;
}

.series-bottom {
  padding: 16px 20px;

  display: flex;

  align-items: center;

  justify-content: space-between;
}

.open-series {
  border: none;

  background: transparent;

  color: white;

  padding: 0;

  cursor: pointer;
}

.icon-button {
  width: 31px;
  height: 31px;

  border: 1px solid #334148;

  background: transparent;

  color: #9aa5a9;

  border-radius: 8px;

  cursor: pointer;
}

.icon-button:hover {
  background: #17242a;

  color: white;
}


/* =====================================================
   BOOK LIST
===================================================== */

.book-list {
  display: flex;

  flex-direction: column;

  gap: 10px;
}

.book {
  min-height: 75px;

  padding: 13px 17px;

  border: 1px solid #26343a;

  border-radius: 13px;

  background: #0d171c;

  display: flex;

  align-items: center;

  gap: 15px;
}

.book-cover {
  width: 45px;
  height: 55px;

  border-radius: 7px;

  background: #17242a;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 20px;

  flex-shrink: 0;
}

.book-info {
  flex: 1;

  min-width: 0;
}

.book-title {
  font-family: Georgia, serif;

  font-size: 17px;

  word-break: break-word;
}

.book-meta {
  color: #68767b;

  font-size: 10px;

  margin-top: 5px;
}


/* =====================================================
   BIG CLICKABLE FAVORITE HEART
===================================================== */

.favorite {
  width: 44px;
  height: 44px;

  border: 1px solid #35434a;

  border-radius: 50%;

  background: transparent;

  color: #7b888d;

  font-size: 25px;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

  flex-shrink: 0;

  transition:
    .2s ease;
}

.favorite:hover {
  border-color: #f9f9f9;

  color: #f9f9f9;

  transform: scale(1.08);
}

.favorite.active {
  color: #ffffff;

  border-color: #ffffff;
}

.favorite.active:hover {
  background: #17242a;

  transform: scale(1.08);
}


/* =====================================================
   BOOK BUTTONS
===================================================== */

.open-book {
  border: 1px solid #35434a;

  background: transparent;

  color: white;

  padding: 8px 12px;

  border-radius: 8px;

  font-size: 10px;

  cursor: pointer;
}

.open-book:hover {
  background: #17242a;
}

.delete-book {
  border: none;

  background: transparent;

  color: #59666b;

  font-size: 18px;

  cursor: pointer;
}

.delete-book:hover {
  color: white;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {
  border: 1px dashed #2b3940;

  border-radius: 18px;

  padding: 65px 25px;

  text-align: center;
}

.empty-icon {
  font-size: 45px;

  margin-bottom: 15px;
}

.empty h2 {
  margin: 0;

  font-family: Georgia, serif;

  font-size: 30px;

  font-weight: 400;
}

.empty p {
  color: #718087;

  font-size: 13px;

  line-height: 1.6;

  margin: 12px auto 25px;

  max-width: 400px;
}


/* =====================================================
   SERIES PAGE
===================================================== */

#seriesPage {
  display: none;
}

.back {
  border: none;

  background: transparent;

  color: #718087;

  padding: 0;

  cursor: pointer;

  margin-bottom: 25px;
}

.back:hover {
  color: white;
}

.series-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 20px;

  margin-bottom: 35px;
}

.series-heading {
  display: flex;

  align-items: center;

  gap: 15px;
}

.series-heading-icon {
  width: 60px;
  height: 60px;

  border-radius: 15px;

  background: #17242a;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 27px;
}

.series-heading h2 {
  margin: 0;

  font-family: Georgia, serif;

  font-size: 34px;

  font-weight: 400;
}

.series-heading p {
  margin: 5px 0 0;

  color: #718087;

  font-size: 11px;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 200;

  background: rgba(0,0,0,.82);

  align-items: center;

  justify-content: center;

  padding: 20px;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;

  max-width: 440px;

  padding: 30px;

  background: #0f191e;

  border: 1px solid #35434a;

  border-radius: 18px;
}

.modal-box h2 {
  margin: 0 0 25px;

  font-family: Georgia, serif;

  font-size: 28px;

  font-weight: 400;
}


/* =====================================================
   BOOK TYPE CHOICE
===================================================== */

.choice-row {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-bottom: 22px;
}

.choice {
  padding: 18px 12px;

  border: 1px solid #35434a;

  border-radius: 12px;

  background: #091115;

  color: #89969b;

  cursor: pointer;

  text-align: center;
}

.choice:hover {
  border-color: #718087;

  color: white;
}

.choice.selected {
  border-color: white;

  color: white;

  background: #17242a;
}

.choice-icon {
  display: block;

  font-size: 25px;

  margin-bottom: 7px;
}


/* =====================================================
   FORM
===================================================== */

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;

  color: #718087;

  font-size: 10px;

  text-transform: uppercase;

  letter-spacing: 1px;

  margin-bottom: 7px;
}

.field input,
.field select {
  width: 100%;

  height: 45px;

  padding: 0 12px;

  border: 1px solid #303e44;

  border-radius: 8px;

  background: #091115;

  color: white;

  outline: none;
}

.field input:focus,
.field select:focus {
  border-color: #68767b;
}


/* =====================================================
   MODAL BUTTONS
===================================================== */

.modal-actions {
  display: flex;

  gap: 10px;

  margin-top: 22px;
}

.modal-actions button {
  flex: 1;

  height: 43px;

  border-radius: 9px;

  cursor: pointer;
}

.cancel {
  border: 1px solid #35434a;

  background: transparent;

  color: white;
}

.create {
  border: none;

  background: white;

  color: #080f13;

  font-weight: 600;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

  header {
    padding: 0 20px;
  }

  main {
    width: 90%;

    padding-top: 45px;
  }

  .series-header {
    display: block;
  }

  .series-header .primary {
    margin-top: 20px;
  }

  .open-book {
    display: none;
  }

  .book {
    gap: 9px;
  }

  .book-cover {
    width: 38px;

    height: 48px;
  }

  .choice-row {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>

<main>


<div id="homePage">

  <h1>
    My Library
  </h1>


  <p class="description">

    Every series gets a shelf.
    Every standalone gets its own place.
    Keep your favorites close and build
    your collection your way.

  </p>


  <div class="actions">

    <button
      class="primary"
      onclick="openSeriesModal()">

      ＋ Create Series

    </button>


    <button
      class="secondary"
      onclick="openBookModal()">

      ＋ Add Book

    </button>

  </div>


  <!-- =================================================
       TABS
  ================================================== -->

  <div class="tabs">

    <button
      id="allTab"
      class="tab active"
      onclick="showAll()">

      ALL BOOKS

    </button>


    <button
      id="favoritesTab"
      class="tab"
      onclick="showFavorites()">

      ♥ FAVORITES

    </button>

  </div>


  <!-- =================================================
       ALL CONTENT
  ================================================== -->

  <div id="allContent">


    <!-- SERIES -->

    <section class="section">

      <div class="section-header">

        <div class="section-title">
          📚 Series
        </div>

        <div
          id="seriesCount"
          class="section-count">

          0 series

        </div>

      </div>


      <div
        id="seriesGrid"
        class="series-grid">

      </div>

    </section>


    <!-- STANDALONE -->

    <section class="section">

      <div class="section-header">

        <div class="section-title">
          📖 Standalone Books
        </div>

        <div
          id="standaloneCount"
          class="section-count">

          0 books

        </div>

      </div>


      <div
        id="standaloneList"
        class="book-list">

      </div>

    </section>


  </div>


  <!-- =================================================
       FAVORITES
  ================================================== -->

  <div
    id="favoritesContent"
    style="display:none;">

    <section class="section">

      <div class="section-header">

        <div class="section-title">
          ♥ Favorite Books
        </div>

        <div
          id="favoritesCount"
          class="section-count">

          0 favorites

        </div>

      </div>


      <div
        id="favoritesList"
        class="book-list">

      </div>

    </section>

  </div>


</div>


<!-- =====================================================
     SERIES PAGE
===================================================== -->

<div id="seriesPage">


  <button
    class="back"
    onclick="goHome()">

    ← Back to My Library

  </button>


  <div class="series-header">


    <div class="series-heading">

      <div
        id="seriesPageIcon"
        class="series-heading-icon">

        📚

      </div>


      <div>

        <h2 id="seriesPageName">
          Series
        </h2>

        <p id="seriesPageCount">
          0 books
        </p>

      </div>

    </div>


    <button
      class="primary"
      onclick="openBookModalForSeries()">

      ＋ Add Book

    </button>


  </div>


  <div
    id="seriesBookList"
    class="book-list">

  </div>


</div>


</main>


<!-- =====================================================
     CREATE SERIES MODAL
===================================================== -->

<div
  id="seriesModal"
  class="modal">


  <div class="modal-box">


    <h2>
      Create a Series Shelf
    </h2>


    <div class="field">

      <label>
        Series name
      </label>

      <input
        id="seriesName"
        type="text"
        placeholder="Example: Made Series">

    </div>


    <div class="field">

      <label>
        Shelf icon
      </label>

      <select id="seriesIcon">

        <option value="📚">
          📚 Books
        </option>

        <option value="🌸">
          🌸 Romance
        </option>

        <option value="🌙">
          🌙 Night Reads
        </option>

        <option value="✨">
          ✨ Stories
        </option>

        <option value="🔥">
          🔥 Favorites
        </option>

        <option value="🖤">
          🖤 Dark Reads
        </option>

      </select>

    </div>


    <div class="modal-actions">

      <button
        class="cancel"
        onclick="closeSeriesModal()">

        Cancel

      </button>


      <button
        class="create"
        onclick="createSeries()">

        Create Shelf

      </button>

    </div>


  </div>

</div>


<!-- =====================================================
     ADD BOOK MODAL
===================================================== -->

<div
  id="bookModal"
  class="modal">


  <div class="modal-box">


    <h2>
      Add a Book
    </h2>


    <div class="choice-row">


      <button
        id="seriesChoice"
        class="choice selected"
        onclick="selectBookType('series')">

        <span class="choice-icon">
          📚
        </span>

        Series Book

      </button>


      <button
        id="standaloneChoice"
        class="choice"
        onclick="selectBookType('standalone')">

        <span class="choice-icon">
          📖
        </span>

        Standalone

      </button>


    </div>


    <!-- SERIES SELECT -->

    <div
      id="seriesField"
      class="field">

      <label>
        Choose series
      </label>

      <select id="bookSeries">

      </select>

    </div>


    <!-- TITLE -->

    <div class="field">

      <label>
        Book title
      </label>

      <input
        id="bookTitle"
        type="text"
        placeholder="Example: The Sweetest Oblivion">

    </div>


    <!-- LINK -->

    <div class="field">

      <label>
        PDF / Drive link — optional
      </label>

      <input
        id="bookLink"
        type="url"
        placeholder="Paste your book link">

    </div>


    <div class="modal-actions">

      <button
        class="cancel"
        onclick="closeBookModal()">

        Cancel

      </button>


      <button
        class="create"
        onclick="addBook()">

        Add Book

      </button>

    </div>


  </div>

</div>


<script>

/* =====================================================
   DATA
===================================================== */

const STORAGE_KEY =
  "myshelf_library_v2";


let library =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || {

    series: [],

    standalone: []

  };


let currentSeriesId = null;

let selectedBookType = "series";


/* =====================================================
   SAVE
===================================================== */

function save() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(library)
  );

}


/* =====================================================
   SERIES MODAL
===================================================== */

function openSeriesModal() {

  document
    .getElementById("seriesModal")
    .classList.add("show");

}


function closeSeriesModal() {

  document
    .getElementById("seriesModal")
    .classList.remove("show");

}


/* =====================================================
   CREATE SERIES
===================================================== */

function createSeries() {

  const name =
    document
      .getElementById("seriesName")
      .value
      .trim();


  if (!name) {

    alert(
      "Please enter a series name."
    );

    return;

  }


  const icon =
    document
      .getElementById("seriesIcon")
      .value;


  library.series.push({

    id:
      Date.now().toString(),

    name:
      name,

    icon:
      icon,

    books:
      []

  });


  save();

  document
    .getElementById("seriesName")
    .value = "";


  closeSeriesModal();

  renderAll();

}


/* =====================================================
   BOOK MODAL
===================================================== */

function openBookModal() {

  selectedBookType =
    "series";

  updateBookTypeUI();

  populateSeriesSelect();

  document
    .getElementById("bookModal")
    .classList.add("show");

}


function openBookModalForSeries() {

  selectedBookType =
    "series";

  populateSeriesSelect();


  const select =
    document.getElementById(
      "bookSeries"
    );


  if (currentSeriesId) {

    select.value =
      currentSeriesId;

  }


  updateBookTypeUI();


  document
    .getElementById("bookModal")
    .classList.add("show");

}


function closeBookModal() {

  document
    .getElementById("bookModal")
    .classList.remove("show");

}


/* =====================================================
   BOOK TYPE
===================================================== */

function selectBookType(type) {

  selectedBookType =
    type;

  updateBookTypeUI();

}


function updateBookTypeUI() {

  const seriesChoice =
    document.getElementById(
      "seriesChoice"
    );

  const standaloneChoice =
    document.getElementById(
      "standaloneChoice"
    );

  const seriesField =
    document.getElementById(
      "seriesField"
    );


  if (
    selectedBookType === "series"
  ) {

    seriesChoice
      .classList
      .add("selected");

    standaloneChoice
      .classList
      .remove("selected");

    seriesField.style.display =
      "block";

  }

  else {

    seriesChoice
      .classList
      .remove("selected");

    standaloneChoice
      .classList
      .add("selected");

    seriesField.style.display =
      "none";

  }

}


/* =====================================================
   SERIES DROPDOWN
===================================================== */

function populateSeriesSelect() {

  const select =
    document.getElementById(
      "bookSeries"
    );


  select.innerHTML = "";


  if (
    library.series.length === 0
  ) {

    select.innerHTML = `

      <option value="">
        No series created yet
      </option>

    `;

    return;

  }


  library.series.forEach(
    series => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        series.id;


      option.textContent =
        series.icon +
        " " +
        series.name;


      select.appendChild(
        option
      );

    }
  );


  if (currentSeriesId) {

    select.value =
      currentSeriesId;

  }

}


/* =====================================================
   ADD BOOK
===================================================== */

function addBook() {

  const title =
    document
      .getElementById("bookTitle")
      .value
      .trim();


  const link =
    document
      .getElementById("bookLink")
      .value
      .trim();


  if (!title) {

    alert(
      "Please enter the book title."
    );

    return;

  }


  const book = {

    id:
      Date.now().toString(),

    title:
      title,

    link:
      link,

    favorite:
      false

  };


  /* SERIES BOOK */

  if (
    selectedBookType === "series"
  ) {

    const seriesId =
      document
        .getElementById("bookSeries")
        .value;


    const series =
      library.series.find(
        s =>
          s.id === seriesId
      );


    if (!series) {

      alert(
        "Please create a series first."
      );

      return;

    }


    series.books.push(
      book
    );

  }


  /* STANDALONE BOOK */

  else {

    library.standalone.push(
      book
    );

  }


  save();


  document
    .getElementById("bookTitle")
    .value = "";


  document
    .getElementById("bookLink")
    .value = "";


  closeBookModal();

  renderAll();


  if (
    currentSeriesId &&
    selectedBookType === "series"
  ) {

    renderSeriesPage();

  }

}


/* =====================================================
   RENDER EVERYTHING
===================================================== */

function renderAll() {

  renderSeries();

  renderStandalone();

  renderFavorites();

}


/* =====================================================
   RENDER SERIES
===================================================== */

function renderSeries() {

  const grid =
    document.getElementById(
      "seriesGrid"
    );


  grid.innerHTML = "";


  document
    .getElementById("seriesCount")
    .textContent =
      library.series.length +
      " series";


  if (
    library.series.length === 0
  ) {

    grid.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;">

        <div class="empty-icon">
          📚
        </div>

        <h2>
          No series yet
        </h2>

        <p>
          Create a series to turn it
          into a shelf for your books.
        </p>

        <button
          class="primary"
          onclick="openSeriesModal()">

          ＋ Create Series

        </button>

      </div>

    `;

    return;

  }


  library.series.forEach(
    series => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "series-card";


      card.innerHTML = `

        <div class="series-top">

          <div class="series-icon">
            ${escapeHTML(series.icon)}
          </div>

          <div class="series-name">
            ${escapeHTML(series.name)}
          </div>

          <div class="series-count">

            ${series.books.length}
            ${
              series.books.length === 1
                ? " book"
                : " books"
            }

          </div>

        </div>


        <div class="series-bottom">

          <button
            class="open-series"
            onclick="openSeries(
              '${series.id}'
            )">

            Open Shelf →

          </button>


          <div>

            <button
              class="icon-button"
              onclick="renameSeries(
                '${series.id}'
              )">

              ✎

            </button>


            <button
              class="icon-button"
              onclick="deleteSeries(
                '${series.id}'
              )">

              ×

            </button>

          </div>

        </div>

      `;


      grid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   RENDER STANDALONES
===================================================== */

function renderStandalone() {

  const list =
    document.getElementById(
      "standaloneList"
    );


  list.innerHTML = "";


  document
    .getElementById(
      "standaloneCount"
    )
    .textContent =
      library.standalone.length +
      (
        library.standalone.length === 1
          ? " book"
          : " books"
      );


  if (
    library.standalone.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📖
        </div>

        <h2>
          No standalone books
        </h2>

        <p>
          Add a book without assigning
          it to a series.
        </p>

        <button
          class="primary"
          onclick="openStandaloneModal()">

          ＋ Add Standalone

        </button>

      </div>

    `;

    return;

  }


  library.standalone.forEach(
    book => {

      list.appendChild(
        createBookElement(
          book,
          null
        )
      );

    }
  );

}


function createBookElement(
  book,
  series
) {

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "book";


  const seriesName =
    series
      ? series.name
      : "Standalone book";


  row.innerHTML = `

    <div class="book-cover">
      📖
    </div>


    <div class="book-info">

      <div class="book-title">
        ${escapeHTML(book.title)}
      </div>

      <div class="book-meta">
        ${escapeHTML(seriesName)}
      </div>

    </div>


    <!-- BIG CLICKABLE HEART -->

    <button
      class="favorite ${
        book.favorite
          ? "active"
          : ""
      }"
      aria-label="${
        book.favorite
          ? "Remove from favorites"
          : "Add to favorites"
      }"
      title="${
        book.favorite
          ? "Remove from favorites"
          : "Add to favorites"
      }"
      onclick="toggleFavorite(
        '${series ? series.id : ""}',
        '${book.id}'
      )">

      ${
        book.favorite
          ? "♥"
          : "♡"
      }

    </button>


    ${
      book.link
        ? `

          <button
            class="open-book"
            onclick="openBook(
              '${series ? series.id : ""}',
              '${book.id}'
            )">

            Open

          </button>

        `
        : ""
    }


    <button
      class="delete-book"
      title="Delete book"
      onclick="deleteBook(
        '${series ? series.id : ""}',
        '${book.id}'
      )">

      ×

    </button>

  `;


  return row;

}


/* =====================================================
   OPEN SERIES
===================================================== */

function openSeries(id) {

  const series =
    library.series.find(
      s =>
        s.id === id
    );


  if (!series) return;


  currentSeriesId =
    id;


  document
    .getElementById(
      "homePage"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "seriesPage"
    )
    .style.display =
      "block";


  renderSeriesPage();

}


/* =====================================================
   SERIES PAGE
===================================================== */

function renderSeriesPage() {

  const series =
    library.series.find(
      s =>
        s.id === currentSeriesId
    );


  if (!series) return;


  document
    .getElementById(
      "seriesPageIcon"
    )
    .textContent =
      series.icon;


  document
    .getElementById(
      "seriesPageName"
    )
    .textContent =
      series.name;


  document
    .getElementById(
      "seriesPageCount"
    )
    .textContent =
      series.books.length +
      (
        series.books.length === 1
          ? " book"
          : " books"
      );


  const list =
    document.getElementById(
      "seriesBookList"
    );


  list.innerHTML = "";


  if (
    series.books.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📖
        </div>

        <h2>
          This shelf is empty
        </h2>

        <p>
          Add the books that belong
          to this series.
        </p>

        <button
          class="primary"
          onclick="openBookModalForSeries()">

          ＋ Add Book

        </button>

      </div>

    `;

    return;

  }


  series.books.forEach(
    book => {

      list.appendChild(
        createBookElement(
          book,
          series
        )
      );

    }
  );

}


/* =====================================================
   HOME
===================================================== */

function goHome() {

  currentSeriesId =
    null;


  document
    .getElementById(
      "seriesPage"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "homePage"
    )
    .style.display =
      "block";


  showAll();

}


/* =====================================================
   FAVORITES
===================================================== */

function showFavorites() {

  document
    .getElementById(
      "allContent"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "favoritesContent"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "allTab"
    )
    .classList
    .remove("active");


  document
    .getElementById(
      "favoritesTab"
    )
    .classList
    .add("active");


  renderFavorites();

}


function renderFavorites() {

  const list =
    document.getElementById(
      "favoritesList"
    );


  list.innerHTML = "";


  let count = 0;


  /* SERIES FAVORITES */

  library.series.forEach(
    series => {

      series.books.forEach(
        book => {

          if (
            book.favorite
          ) {

            count++;

            list.appendChild(
              createBookElement(
                book,
                series
              )
            );

          }

        }
      );

    }
  );


  /* STANDALONE FAVORITES */

  library.standalone.forEach(
    book => {

      if (
        book.favorite
      ) {

        count++;

        list.appendChild(
          createBookElement(
            book,
            null
          )
        );

      }

    }
  );


  document
    .getElementById(
      "favoritesCount"
    )
    .textContent =
      count +
      (
        count === 1
          ? " favorite"
          : " favorites"
      );


  if (count === 0) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ♡
        </div>

        <h2>
          No favorites yet
        </h2>

        <p>
          Click the heart beside any
          book to add it to favorites.
        </p>

      </div>

    `;

  }

}


/* =====================================================
   ALL TAB
===================================================== */

function showAll() {

  document
    .getElementById(
      "allContent"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "favoritesContent"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "allTab"
    )
    .classList
    .add("active");


  document
    .getElementById(
      "favoritesTab"
    )
    .classList
    .remove("active");


  renderAll();

}


/* =====================================================
   FAVORITE TOGGLE
===================================================== */

function toggleFavorite(
  seriesId,
  bookId
) {

  let book = null;


  if (seriesId) {

    const series =
      library.series.find(
        s =>
          s.id === seriesId
      );


    if (series) {

      book =
        series.books.find(
          b =>
            b.id === bookId
        );

    }

  }

  else {

    book =
      library.standalone.find(
        b =>
          b.id === bookId
      );

  }


  if (!book) return;


  book.favorite =
    !book.favorite;


  save();


  renderAll();


  if (
    currentSeriesId
  ) {

    renderSeriesPage();

  }


  if (
    document
      .getElementById(
        "favoritesContent"
      )
      .style.display !== "none"
  ) {

    renderFavorites();

  }

}


/* =====================================================
   OPEN BOOK
===================================================== */

function openBook(
  seriesId,
  bookId
) {

  let book = null;


  if (seriesId) {

    const series =
      library.series.find(
        s =>
          s.id === seriesId
      );


    if (series) {

      book =
        series.books.find(
          b =>
            b.id === bookId
        );

    }

  }

  else {

    book =
      library.standalone.find(
        b =>
          b.id === bookId
      );

  }


  if (
    book &&
    book.link
  ) {

    window.open(
      book.link,
      "_blank"
    );

  }

}


/* =====================================================
   DELETE BOOK
===================================================== */

function deleteBook(
  seriesId,
  bookId
) {

  if (
    !confirm(
      "Remove this book?"
    )
  ) {

    return;

  }


  if (seriesId) {

    const series =
      library.series.find(
        s =>
          s.id === seriesId
      );


    if (series) {

      series.books =
        series.books.filter(
          b =>
            b.id !== bookId
        );

    }

  }

  else {

    library.standalone =
      library.standalone.filter(
        b =>
          b.id !== bookId
      );

  }


  save();

  renderAll();


  if (
    currentSeriesId
  ) {

    renderSeriesPage();

  }

}


/* =====================================================
   RENAME SERIES
===================================================== */

function renameSeries(id) {

  const series =
    library.series.find(
      s =>
        s.id === id
    );


  if (!series) return;


  const name =
    prompt(
      "Enter the new series name:",
      series.name
    );


  if (
    name &&
    name.trim()
  ) {

    series.name =
      name.trim();

    save();

    renderAll();


    if (
      currentSeriesId === id
    ) {

      renderSeriesPage();

    }

  }

}


/* =====================================================
   DELETE SERIES
===================================================== */

function deleteSeries(id) {

  const series =
    library.series.find(
      s =>
        s.id === id
    );


  if (!series) return;


  if (
    !confirm(
      "Delete this series and all books inside it?"
    )
  ) {

    return;

  }


  library.series =
    library.series.filter(
      s =>
        s.id !== id
    );


  save();

  renderAll();

}


/* =====================================================
   STANDALONE QUICK BUTTON
===================================================== */

function openStandaloneModal() {

  selectedBookType =
    "standalone";

  updateBookTypeUI();

  document
    .getElementById(
      "bookModal"
    )
    .classList
    .add("show");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   CLOSE MODALS OUTSIDE
===================================================== */

document
  .getElementById(
    "seriesModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeSeriesModal();

      }

    }
  );


document
  .getElementById(
    "bookModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeBookModal();

      }

    }
  );

renderAll();

</script>
