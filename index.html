
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyShelf</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;

  background: #080f13;
  color: #f9f9f9;

  font-family: Arial, sans-serif;
}

.library {
  display: flex;
  min-height: 100vh;
  width: 100%;
  background: #080f13;
}


/* SIDEBAR */

.sidebar {
  width: 294px;
  min-height: 100vh;

  padding: 20px;

  background: #080f13;

  border-right: 1px solid #263238;

  flex-shrink: 0;
}

.logo {
  font-family: Georgia, serif;
  font-size: 32px;

  color: #f9f9f9;

  margin: 0 0 8px 13px;

  letter-spacing: -1px;
}

.tagline {
  margin-left: 13px;

  color: #9da8ad;

  font-size: 10px;

  letter-spacing: 3px;

  text-transform: uppercase;
}


/* NAV */

.nav {
  margin-top: 25px;
}

.nav-item {
  height: 49px;

  display: flex;
  align-items: center;

  padding: 0 13px;

  margin-bottom: 3px;

  border-radius: 14px;

  color: #f9f9f9;

  font-size: 16px;

  cursor: pointer;
}

.nav-item:hover {
  background: #101a1f;
}

.nav-item.active {
  background: #162228;
}

.nav-icon {
  width: 34px;
}

.nav-name {
  flex: 1;
}

.nav-count {
  color: #8e999e;
  font-size: 11px;
}


/* SHELVES */

.shelves-title {
  display: flex;
  align-items: center;

  margin: 55px 13px 25px;

  color: #9da8ad;

  font-size: 11px;

  letter-spacing: 2px;

  text-transform: uppercase;
}

.shelves-title span {
  flex: 1;
}

.add-shelf {
  color: white;

  font-size: 23px;

  cursor: pointer;

  padding: 0 5px;
}

.add-shelf:hover {
  opacity: .7;
}

.shelf-list {
  margin-top: 5px;
}

.shelf-item {
  display: flex;
  align-items: center;

  height: 42px;

  padding: 0 13px;

  border-radius: 10px;

  color: #c5cdd0;

  cursor: pointer;
}

.shelf-item:hover {
  background: #101a1f;
}

.shelf-emoji {
  width: 30px;
}

.shelf-name {
  flex: 1;
}

.delete-shelf {
  color: #777;

  cursor: pointer;

  padding: 5px;
}

.delete-shelf:hover {
  color: white;
}


/* QUOTE */

.quote {
  margin: 67px 13px 0;

  color: #8f999d;

  font-family: Georgia, serif;

  font-style: italic;

  font-size: 14px;

  line-height: 1.6;
}


/* MAIN */

.main {
  flex: 1;

  min-width: 0;

  min-height: 100vh;

  padding: 20px 42px;

  background: #080f13;
}

.top {
  display: flex;

  align-items: flex-end;

  justify-content: space-between;
}

.eyebrow {
  color: #9da8ad;

  font-size: 10px;

  letter-spacing: 3px;

  text-transform: uppercase;

  margin-bottom: 8px;
}

h1 {
  margin: 0;

  color: #f9f9f9;

  font-family: Georgia, serif;

  font-size: 48px;

  font-weight: 400;

  letter-spacing: -1px;
}

.actions {
  display: flex;

  align-items: center;

  gap: 13px;
}

.total {
  color: #9da8ad;

  font-size: 12px;
}

.sort {
  height: 42px;

  padding: 0 13px;

  border-radius: 12px;

  border: 1px solid #303d43;

  background: #10191e;

  color: white;

  outline: none;
}

.add-button {
  height: 42px;

  padding: 0 20px;

  border: none;

  border-radius: 24px;

  background: #f9f9f9;

  color: #080f13;

  font-weight: 600;

  text-decoration: none;

  display: inline-flex;

  align-items: center;

  justify-content: center;
}

.add-button:hover {
  opacity: .85;
}


/* BOOKS */

.book-grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(220px, 1fr));

  gap: 20px;

  margin-top: 40px;
}

.book-card {
  background: #10191e;

  border: 1px solid #263238;

  border-radius: 16px;

  padding: 20px;

  min-height: 190px;
}

.book-icon {
  font-size: 42px;

  margin-bottom: 15px;
}

.book-name {
  color: white;

  font-family: Georgia, serif;

  font-size: 18px;

  line-height: 1.4;

  word-break: break-word;

  margin-bottom: 8px;
}

.book-type {
  color: #7f8a8f;

  font-size: 11px;

  margin-bottom: 18px;
}

.book-open {
  display: inline-block;

  padding: 9px 14px;

  border-radius: 8px;

  background: white;

  color: #080f13;

  text-decoration: none;

  font-size: 12px;

  font-weight: 600;
}

.book-open:hover {
  opacity: .85;
}


/* EMPTY */

.empty-state {
  min-height: calc(100vh - 120px);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;
}

.empty-icon {
  font-size: 58px;

  margin-bottom: 15px;
}

.empty-state h2 {
  margin: 0;

  color: white;

  font-family: Georgia, serif;

  font-size: 36px;

  font-weight: 400;
}

.empty-state p {
  margin: 17px 0 22px;

  color: #9da8ad;

  font-size: 14px;
}


/* STATUS */

.status {
  margin-top: 30px;

  text-align: center;

  color: #7d898e;

  font-size: 13px;
}


/* POPUP */

.popup {
  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.75);

  align-items: center;

  justify-content: center;

  z-index: 9999;
}

.popup-box {
  width: 90%;

  max-width: 390px;

  padding: 30px;

  background: #111;

  border: 1px solid #333;

  border-radius: 16px;
}

.popup-box h2 {
  margin-top: 0;

  font-family: Georgia, serif;

  font-weight: 400;
}

.popup-box input,
.popup-box select {
  width: 100%;

  padding: 13px;

  margin-bottom: 12px;

  border-radius: 8px;

  border: 1px solid #333;

  background: #1c1c1c;

  color: white;
}

.popup-buttons {
  display: flex;

  gap: 10px;
}

.popup-buttons button {
  flex: 1;

  padding: 12px;

  border-radius: 8px;

  cursor: pointer;
}

.create {
  border: none;

  background: white;

  color: black;
}

.cancel {
  border: 1px solid #444;

  background: transparent;

  color: white;
}


/* MOBILE */

@media (max-width: 800px) {

  .sidebar {
    width: 220px;
  }

  .main {
    padding: 20px 25px;
  }

  h1 {
    font-size: 40px;
  }

}

@media (max-width: 600px) {

  .library {
    display: block;
  }

  .sidebar {
    width: 100%;

    min-height: auto;

    border-right: none;

    border-bottom: 1px solid #263238;
  }

  .quote {
    display: none;
  }

  .main {
    padding: 25px 18px;
  }

  .top {
    display: block;
  }

  .actions {
    margin-top: 20px;

    flex-wrap: wrap;

    justify-content: flex-start;
  }

  h1 {
    font-size: 38px;
  }

}

</style>

</head>


<body>


<div class="library">


<!-- SIDEBAR -->

<aside class="sidebar">

  <div class="logo">
    MyShelf
  </div>

  <div class="tagline">
    YOUR LITTLE LIBRARY
  </div>


  <div class="nav">


    <div
      class="nav-item active"
      id="allBooksButton">

      <div class="nav-icon">
        📚
      </div>

      <div class="nav-name">
        All Books
      </div>

      <div
        class="nav-count"
        id="allCount">

        0

      </div>

    </div>


    <div
      class="nav-item"
      id="favoritesButton">

      <div class="nav-icon">
        ♥
      </div>

      <div class="nav-name">
        Favorites
      </div>

      <div
        class="nav-count"
        id="favoriteCount">

        0

      </div>

    </div>


    <div class="shelves-title">

      <span>
        MY SHELVES
      </span>

      <div
        class="add-shelf"
        id="addShelf">

        +

      </div>

    </div>


    <div
      class="shelf-list"
      id="shelfList">

    </div>


  </div>


  <div class="quote">

    "A room without books is like a body without a soul."

  </div>

</aside>


<!-- MAIN -->

<main class="main">


  <div class="top">


    <div>

      <div class="eyebrow">
        YOUR PERSONAL LIBRARY
      </div>

      <h1 id="title">
        My Books
      </h1>

    </div>


    <div class="actions">

      <span
        class="total"
        id="total">

        0 books

      </span>


      <select id="sort">

        <option value="recent">
          Recently Added
        </option>

        <option value="title">
          Title A–Z
        </option>

        <option value="favorite">
          Favorites First
        </option>

      </select>


      <a
        class="add-button"
        href="drive.html">

        + Add Books

      </a>

    </div>

  </div>


  <div id="content"></div>


  <div
    class="status"
    id="status">

    Checking your MyShelf account...

  </div>


</main>

</div>


<!-- SHELF POPUP -->

<div
  class="popup"
  id="shelfPopup">

  <div class="popup-box">

    <h2>
      Create a Shelf
    </h2>


    <input
      id="shelfName"
      type="text"
      placeholder="Shelf name">


    <select id="shelfEmoji">

      <option value="📚">
        📚 Books
      </option>

      <option value="❤️">
        ❤️ Favorites
      </option>

      <option value="⭐">
        ⭐ Favorites
      </option>

      <option value="🌙">
        🌙 Night Reads
      </option>

      <option value="✨">
        ✨ To Read
      </option>

      <option value="🔥">
        🔥 Currently Reading
      </option>

    </select>


    <div class="popup-buttons">

      <button
        class="cancel"
        id="cancelShelf">

        Cancel

      </button>


      <button
        class="create"
        id="createShelf">

        Create Shelf

      </button>

    </div>

  </div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  deleteDoc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   YOUR FIREBASE PROJECT
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBl-5cfDXHTX0gHubxH9MZx2YwLDbRRKFs",

  authDomain:
    "myshelf-e3440.firebaseapp.com",

  projectId:
    "myshelf-e3440",

  storageBucket:
    "myshelf-e3440.firebasestorage.app",

  messagingSenderId:
    "820092826756",

  appId:
    "1:820092826756:web:0cab1578f5dfc3c74ebed1",

  measurementId:
    "G-LB8602RM3L"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;

let books = [];

let shelves = [];

let view = "all";

let selectedShelf = null;


/* =========================================
   ELEMENTS
========================================= */

const content =
  document.getElementById("content");

const status =
  document.getElementById("status");

const total =
  document.getElementById("total");

const allCount =
  document.getElementById("allCount");

const favoriteCount =
  document.getElementById("favoriteCount");

const title =
  document.getElementById("title");

const sort =
  document.getElementById("sort");


/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
  auth,
  async function(user) {

    if (!user) {

      currentUser = null;

      status.textContent =
        "You are not logged in to MyShelf.";

      content.innerHTML = `

        <div class="empty-state">

          <div class="empty-icon">
            🔐
          </div>

          <h2>
            Please log in
          </h2>

          <p>
            Log in to see your MyShelf library.
          </p>

        </div>

      `;

      return;
    }


    currentUser = user;


    status.textContent =
      "Loading your books...";


    await loadBooks();

    await loadShelves();

  }
);


/* =========================================
   LOAD BOOKS
========================================= */

async function loadBooks() {

  try {

    const booksCollection =
      collection(
        db,
        "users",
        currentUser.uid,
        "books"
      );


    const snapshot =
      await getDocs(
        booksCollection
      );


    books = [];


    snapshot.forEach(
      function(item) {

        books.push({

          id: item.id,

          ...item.data()

        });

      }
    );


    render();

  }

  catch(error) {

    console.error(error);


    status.textContent =
      "ERROR: " +
      error.message;

  }

}


/* =========================================
   LOAD SHELVES
========================================= */

async function loadShelves() {

  try {

    const shelvesCollection =
      collection(
        db,
        "users",
        currentUser.uid,
        "shelves"
      );


    const snapshot =
      await getDocs(
        shelvesCollection
      );


    shelves = [];


    snapshot.forEach(
      function(item) {

        shelves.push({

          id: item.id,

          ...item.data()

        });

      }
    );


    renderShelves();

  }

  catch(error) {

    console.error(error);

  }

}


/* =========================================
   RENDER
========================================= */

function render() {

  let visible =
    [...books];


  if (view === "favorites") {

    visible =
      visible.filter(
        book =>
          book.favorite === true
      );

    title.textContent =
      "Favorites";

  }

  else if (view === "shelf") {

    visible =
      visible.filter(
        book =>
          book.shelfId === selectedShelf
      );

    const shelf =
      shelves.find(
        item =>
          item.id === selectedShelf
      );

    title.textContent =
      shelf
        ? shelf.name
        : "My Books";

  }

  else {

    title.textContent =
      "My Books";

  }


  if (sort.value === "title") {

    visible.sort(
      (a,b) =>
        (a.name || "")
        .localeCompare(
          b.name || ""
        )
    );

  }


  if (sort.value === "favorite") {

    visible.sort(
      (a,b) =>
        Number(b.favorite === true) -
        Number(a.favorite === true)
    );

  }


  total.textContent =
    books.length +
    (
      books.length === 1
        ? " book"
        : " books"
    );


  allCount.textContent =
    books.length;


  favoriteCount.textContent =
    books.filter(
      book =>
        book.favorite === true
    ).length;


  if (visible.length === 0) {

    content.innerHTML = `

      <div class="empty-state">

        <div class="empty-icon">
          📚
        </div>

        <h2>
          ${
            view === "favorites"
              ? "No favorites yet"
              : view === "shelf"
                ? "This shelf is empty"
                : "Your library is waiting"
          }
        </h2>

        <p>
          ${
            view === "favorites"
              ? "Favorite a book to see it here."
              : view === "shelf"
                ? "Add books to this shelf."
                : "Choose your first PDF from Google Drive."
          }
        </p>

        ${
          view === "all"
            ? `
              <a
                class="add-button"
                href="drive.html">

                + Choose from Drive

              </a>
            `
            : ""
        }

      </div>

    `;


    status.textContent = "";

    return;

  }


  content.innerHTML = `

    <div class="book-grid">

      ${
        visible.map(
          createBookCard
        ).join("")
      }

    </div>

  `;


  status.textContent =
    "";

}


/* =========================================
   BOOK CARD
========================================= */

function createBookCard(book) {

  const url =
    book.url ||
    (
      book.fileId
        ? "https://drive.google.com/open?id=" +
          encodeURIComponent(
            book.fileId
          )
        : ""
    );


  const name =
    escapeHtml(
      book.name ||
      "Untitled Book"
    );


  return `

    <div class="book-card">

      <div class="book-icon">
        📖
      </div>

      <div class="book-name">
        ${name}
      </div>

      <div class="book-type">
        ${
          book.mimeType &&
          book.mimeType.includes("pdf")
            ? "PDF"
            : "Book"
        }
      </div>

      ${
        url
          ? `
            <a
              class="book-open"
              href="${escapeAttribute(url)}"
              target="_blank"
              rel="noopener">

              Open Book

            </a>
          `
          : ""
      }

    </div>

  `;

}


/* =========================================
   SHELVES
========================================= */

function renderShelves() {

  const shelfList =
    document.getElementById(
      "shelfList"
    );


  shelfList.innerHTML =
    "";


  shelves.forEach(
    function(shelf) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "shelf-item";


      item.innerHTML = `

        <div class="shelf-emoji">
          ${escapeHtml(
            shelf.emoji || "📚"
          )}
        </div>

        <div class="shelf-name">
          ${escapeHtml(
            shelf.name || "Shelf"
          )}
        </div>

        <div
          class="delete-shelf">

          ×

        </div>

      `;


      item
        .querySelector(
          ".shelf-name"
        )
        .onclick =
        function() {

          view =
            "shelf";

          selectedShelf =
            shelf.id;

          render();

        };


      item
        .querySelector(
          ".shelf-emoji"
        )
        .onclick =
        function() {

          view =
            "shelf";

          selectedShelf =
            shelf.id;

          render();

        };


      item
        .querySelector(
          ".delete-shelf"
        )
        .onclick =
        async function(event) {

          event.stopPropagation();


          if (
            !confirm(
              "Delete this shelf?"
            )
          ) {
            return;
          }


          await deleteDoc(
            doc(
              db,
              "users",
              currentUser.uid,
              "shelves",
              shelf.id
            )
          );


          shelves =
            shelves.filter(
              item =>
                item.id !== shelf.id
            );


          renderShelves();

          view =
            "all";

          selectedShelf =
            null;

          render();

        };


      shelfList.appendChild(
        item
      );

    }
  );

}


/* =========================================
   CREATE SHELF
========================================= */

document
  .getElementById("addShelf")
  .onclick =
  function() {

    document
      .getElementById("shelfPopup")
      .style.display =
      "flex";

  };


document
  .getElementById("cancelShelf")
  .onclick =
  function() {

    document
      .getElementById("shelfPopup")
      .style.display =
      "none";

  };


document
  .getElementById("createShelf")
  .onclick =
  async function() {

    const name =
      document
        .getElementById("shelfName")
        .value
        .trim();


    const emoji =
      document
        .getElementById("shelfEmoji")
        .value;


    if (!name) {

      alert(
        "Enter a shelf name."
      );

      return;

    }


    try {

      const shelfRef =
        doc(
          collection(
            db,
            "users",
            currentUser.uid,
            "shelves"
          )
        );


      await setDoc(
        shelfRef,
        {

          name: name,

          emoji: emoji,

          createdAt:
            new Date().toISOString()

        }
      );


      shelves.push({

        id: shelfRef.id,

        name: name,

        emoji: emoji

      });


      renderShelves();


      document
        .getElementById("shelfName")
        .value =
        "";


      document
        .getElementById("shelfPopup")
        .style.display =
        "none";

    }

    catch(error) {

      console.error(error);

      alert(
        "Could not create shelf: " +
        error.message
      );

    }

  };


/* =========================================
   ALL BOOKS
========================================= */

document
  .getElementById("allBooksButton")
  .onclick =
  function() {

    view =
      "all";

    selectedShelf =
      null;

    document
      .getElementById(
        "allBooksButton"
      )
      .classList.add(
        "active"
      );

    document
      .getElementById(
        "favoritesButton"
      )
      .classList.remove(
        "active"
      );

    render();

  };


/* =========================================
   FAVORITES
========================================= */

document
  .getElementById(
    "favoritesButton"
  )
  .onclick =
  function() {

    view =
      "favorites";

    selectedShelf =
      null;

    document
      .getElementById(
        "favoritesButton"
      )
      .classList.add(
        "active"
      );

    document
      .getElementById(
        "allBooksButton"
      )
      .classList.remove(
        "active"
      );

    render();

  };


/* =========================================
   SORT
========================================= */

sort.addEventListener(
  "change",
  render
);


/* =========================================
   CLOSE POPUP
========================================= */

document
  .getElementById(
    "shelfPopup"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        this.style.display =
          "none";

      }

    }
  );


/* =========================================
   SECURITY HELPERS
========================================= */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value) {

  return String(value)

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
