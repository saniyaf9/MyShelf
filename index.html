<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MyShelf — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080f13;
      color: #f9f9f9;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      padding: 25px;
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .tagline {
      text-align: center;
      font-size: 12px;
      letter-spacing: 3px;
      opacity: 0.6;
      margin-bottom: 35px;
    }

    .login-box {
      background: #101a20;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #aab4b9;
      font-size: 14px;
    }

    .google-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #f9f9f9;
      color: #111;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .google-btn:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #aab4b9;
      min-height: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #aab4b9;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #fff;
    }
  </style>

</head>

<body>

  <div class="login-container">

```
<div class="logo">MyShelf</div>
<div class="tagline">YOUR LITTLE LIBRARY</div>

<div class="login-box">

  <h1>Welcome back</h1>

  <p class="subtitle">
    Sign in to enter your personal library.
  </p>

  <button class="google-btn" id="googleLogin">
    Continue with Google
  </button>

  <div class="message" id="message"></div>

  <a class="back" href="/MyShelf/index.html">
    ← Back to MyShelf
  </a>

</div>
```

  </div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyBl-5cfDXHTX0gHubxH9MZx2YwLDbRRKFs",

      authDomain: "myshelf-e3440.firebaseapp.com",

      projectId: "myshelf-e3440",

      storageBucket: "myshelf-e3440.firebasestorage.app",

      messagingSenderId: "820092826756",

      appId: "1:820092826756:web:0cab1578f5dfc3c74ebed1",

      measurementId: "G-LB8602RM3L"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    const googleButton = document.getElementById("googleLogin");

    const message = document.getElementById("message");


    googleButton.addEventListener("click", async () => {

      message.textContent = "Opening Google sign-in...";

      googleButton.disabled = true;

      try {

        await signInWithPopup(auth, provider);

        message.textContent = "Login successful! Opening your library...";

        /*
         * IMPORTANT:
         * This is the exact GitHub Pages location
         * of your library page.
         */

        window.location.replace(
          "/MyShelf/my-library.html"
        );

      } catch (error) {

        console.error("Firebase login error:", error);

        googleButton.disabled = false;

        if (error.code === "auth/popup-closed-by-user") {
          message.textContent = "Sign-in window was closed.";
        } else if (error.code === "auth/unauthorized-domain") {
          message.textContent =
            "This website is not authorized in Firebase.";
        } else {
          message.textContent =
            error.message || "Login failed. Please try again.";
        }

      }

    });

  </script>

</body>
</html>
