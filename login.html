<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MyShelf — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #080f13;
      color: #f9f9f9;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #0f191e;
      border: 1px solid #35434a;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .logo {
      text-align: center;
      font-family: Georgia, serif;
      font-size: 36px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #718087;
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 35px;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #29373d;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      border: none;
      background: transparent;
      color: #68767b;
      padding: 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      color: white;
      border-bottom-color: white;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      color: #718087;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .password-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 48px 0 14px;
      border: 1px solid #303e44;
      border-radius: 9px;
      background: #091115;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .field input:focus {
      border-color: #68767b;
    }

    .eye-button {
      position: absolute;
      right: 8px;
      top: 6px;
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: #718087;
      cursor: pointer;
      font-size: 18px;
    }

    .eye-button:hover {
      color: white;
    }

    .submit-button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #080f13;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit-button:hover {
      background: #dce1e3;
    }

    .message {
      min-height: 20px;
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: #ff9b9b;
      line-height: 1.5;
    }

    .switch-text {
      text-align: center;
      margin-top: 20px;
      color: #718087;
      font-size: 12px;
    }

    .switch-text button {
      border: none;
      background: none;
      color: white;
      cursor: pointer;
      text-decoration: underline;
    }

    #signupForm {
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">MyShelf</div>

    <div class="subtitle">
      Your little library
    </div>

    <div class="tabs">

      <button
        id="loginTab"
        class="tab active"
        onclick="showLogin()">
        Log In
      </button>

      <button
        id="signupTab"
        class="tab"
        onclick="showSignup()">
        Sign Up
      </button>

    </div>


    <!-- LOGIN -->

    <form id="loginForm">

      <div class="field">

        <label>Email</label>

        <input
          id="loginEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="field">

        <label>Password</label>

        <div class="password-wrap">

          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

          <button
            type="button"
            class="eye-button"
            onclick="togglePassword('loginPassword', this)">
            🙈
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="submit-button">
        Log In
      </button>

    </form>


    <!-- SIGN UP -->

    <form id="signupForm">

      <!-- NAME -->

      <div class="field">

        <label>Name</label>

        <input
          id="signupName"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
          required>

      </div>


      <div class="field">

        <label>Email</label>

        <input
          id="signupEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="field">

        <label>Password</label>

        <div class="password-wrap">

          <input
            id="signupPassword"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            required>

          <button
            type="button"
            class="eye-button"
            onclick="togglePassword('signupPassword', this)">
            🙉
          </button>

        </div>

      </div>


      <div class="field">

        <label>Confirm Password</label>

        <div class="password-wrap">

          <input
            id="signupConfirmPassword"
            type="password"
            placeholder="Confirm your password"
            autocomplete="new-password"
            required>

          <button
            type="button"
            class="eye-button"
            onclick="togglePassword('signupConfirmPassword', this)">
            🙉
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="submit-button">
        Create Account
      </button>

    </form>


    <div
      id="message"
      class="message">
    </div>

  </div>


  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>


  <script>

    const firebaseConfig = {

      apiKey:
        "AIzaSyBl-5cfDXHTX0gHubxH9MZx2YwLDbRRKFs",

      authDomain:
        "myshelf-e3440.firebaseapp.com",

      projectId:
        "myshelf-e3440",

      storageBucket:
        "myshelf-e3440.firebasestorage.app",

      messagingSenderId:
        "820092826756",

      appId:
        "1:820092826756:web:0cab1578f5dfc3c74ebed1",

      measurementId:
        "G-LB8602RM3L"

    };


    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();


    /*
      If the user is already logged in,
      don't show the login page again.
    */

    auth.onAuthStateChanged(function(user) {

      if (user) {

      //  window.location.replace("login.html");

      }

    });


    function showLogin() {

      document
        .getElementById("loginForm")
        .style.display = "block";

      document
        .getElementById("signupForm")
        .style.display = "none";

      document
        .getElementById("loginTab")
        .classList.add("active");

      document
        .getElementById("signupTab")
        .classList.remove("active");

      clearMessage();

    }


    function showSignup() {

      document
        .getElementById("loginForm")
        .style.display = "none";

      document
        .getElementById("signupForm")
        .style.display = "block";

      document
        .getElementById("loginTab")
        .classList.remove("active");

      document
        .getElementById("signupTab")
        .classList.add("active");

      clearMessage();

    }


    /*
      SHOW / HIDE PASSWORD
    */

    function togglePassword(
      inputId,
      button
    ) {

      const input =
        document.getElementById(inputId);

      if (
        input.type === "password"
      ) {

        input.type = "text";

        button.textContent = "🙉";

      }

      else {

        input.type = "password";

        button.textContent = "🙈";

      }

    }


    function showMessage(text) {

      document
        .getElementById("message")
        .textContent = text;

    }


    function clearMessage() {

      document
        .getElementById("message")
        .textContent = "";

    }


    /*
      LOGIN
    */

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        function(event) {

          event.preventDefault();

          const email =
            document
              .getElementById("loginEmail")
              .value
              .trim();

          const password =
            document
              .getElementById("loginPassword")
              .value;


          showMessage("Logging in...");


          auth
            .signInWithEmailAndPassword(
              email,
              password
            )

            .then(function() {

              window.location.replace(
                "library.html"
              );

            })

            .catch(function(error) {

              console.error(error);

              showMessage(
                getFirebaseError(error)
              );

            });

        }
      );


    /*
      SIGN UP
    */

    document
      .getElementById("signupForm")
      .addEventListener(
        "submit",
        function(event) {

          event.preventDefault();


          const name =
            document
              .getElementById("signupName")
              .value
              .trim();


          const email =
            document
              .getElementById("signupEmail")
              .value
              .trim();


          const password =
            document
              .getElementById("signupPassword")
              .value;


          const confirmPassword =
            document
              .getElementById("signupConfirmPassword")
              .value;


          /*
            Check the name
          */

          if (name === "") {

            showMessage(
              "Please enter your name."
            );

            return;

          }

          if (
            password !== confirmPassword
          ) {

            showMessage(
              "Passwords do not match."
            );

            return;

          }


          showMessage(
            "Creating your account..."
          );


          /*
            CREATE FIREBASE ACCOUNT
          */

          auth
            .createUserWithEmailAndPassword(
              email,
              password
            )

            .then(function(userCredential) {

              /*
                Save the name to the
                Firebase user's profile.
              */

              return userCredential.user
                .updateProfile({

                  displayName: name

                });

            })

            .then(function() {

              window.location.replace(
                "library.html"
              );

            })

            .catch(function(error) {

              console.error(error);

              showMessage(
                getFirebaseError(error)
              );

            });

        }
      );


    /*
      FRIENDLIER FIREBASE ERRORS
    */

    function getFirebaseError(error) {

      switch (error.code) {

        case "auth/invalid-email":
          return "Please enter a valid email address.";

        case "auth/user-not-found":
          return "No account exists with that email.";

        case "auth/wrong-password":
          return "Incorrect password.";

        case "auth/invalid-credential":
          return "Incorrect email or password.";

        case "auth/email-already-in-use":
          return "An account with this email already exists.";

        case "auth/weak-password":
          return "Your password is too weak.";

        case "auth/too-many-requests":
          return "Too many attempts. Please try again later.";

        default:
          return error.message || "Something went wrong.";

      }

    }

  </script>

</body>
</html>
